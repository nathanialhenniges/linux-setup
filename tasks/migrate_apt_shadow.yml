---
- name: Remove one user-local command shadow
  ansible.builtin.command:
    argv:
      - /bin/rm
      - -f
      - --
      - "{{ apt_shadow.item.1.path }}/{{ apt_shadow.item.0.command }}"
  become: "{{ apt_shadow.item.1.privileged }}"
  when: apt_shadow.item.1.migration == 'remove'

- name: Back up one manual command shadow
  ansible.builtin.command:
    argv:
      - /bin/mv
      - -n
      - --
      - "{{ apt_shadow.item.1.path }}/{{ apt_shadow.item.0.command }}"
      - "{{ apt_shadow.item.1.path }}/{{ apt_shadow.item.0.command }}.pre-linux-setup-apt-{{ ansible_facts.date_time.iso8601_basic_short }}"
  become: "{{ apt_shadow.item.1.privileged }}"
  when: apt_shadow.item.1.migration == 'backup'
