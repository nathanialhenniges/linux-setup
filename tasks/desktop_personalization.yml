---
- name: Inspect user desktop destination directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ workstation_home }}/Pictures"
    - "{{ workstation_home }}/.config"
    - "{{ workstation_home }}/.local"
    - "{{ workstation_home }}/.local/share"
    - "{{ workstation_home }}/.local/share/applications"
    - "{{ workstation_home }}/.local/share/icons"
  register: desktop_directories

- name: Refuse linked or non-directory desktop paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.isdir | default(false)
    fail_msg: "Refusing an unsafe managed desktop directory: {{ item.item }}"
    quiet: true
  loop: "{{ desktop_directories.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure user-local desktop directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ workstation_home }}/Pictures"
    - "{{ workstation_home }}/.config"
    - "{{ workstation_home }}/.local"
    - "{{ workstation_home }}/.local/share"
    - "{{ workstation_home }}/.local/share/applications"
    - "{{ workstation_home }}/.local/share/icons"

- name: Verify checked-in desktop image checksums
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/assets/{{ item.name }}"
    checksum_algorithm: sha256
    follow: false
  loop: "{{ desktop_assets }}"
  register: desktop_asset_sources

- name: Refuse changed or unsafe checked-in desktop images
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.checksum == item.item.sha256
    fail_msg: "The reviewed desktop asset is missing or has changed: {{ item.item.name }}"
    quiet: true
  loop: "{{ desktop_asset_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect existing desktop artwork files
  ansible.builtin.stat:
    path: "{{ workstation_home }}/Pictures/{{ item.name }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ desktop_assets }}"
  register: desktop_asset_targets

- name: Refuse unknown desktop artwork at managed paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isreg | default(false) and item.stat.checksum == item.item.sha256)
    fail_msg: "Refusing unknown or unsafe desktop artwork: {{ item.item.name }}"
    quiet: true
  loop: "{{ desktop_asset_targets.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Copy reviewed desktop images into Pictures
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/{{ item.name }}"
    dest: "{{ workstation_home }}/Pictures/{{ item.name }}"
    mode: "0644"
  loop: "{{ desktop_assets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set the account profile photo
  ansible.builtin.import_tasks: profile_picture.yml

- name: Read the current GNOME light wallpaper
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.desktop.background, picture-uri]
  register: gnome_light_wallpaper
  changed_when: false
  when: "'GNOME' in (ansible_facts.env.XDG_CURRENT_DESKTOP | default(''))"

- name: Set the supplied wallpaper in GNOME light mode
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.desktop.background
      - picture-uri
      - "'file://{{ workstation_home }}/Pictures/mrdemonwolf-desktop-wallpaper.png'"
  when:
    - "'GNOME' in (ansible_facts.env.XDG_CURRENT_DESKTOP | default(''))"
    - >-
      (gnome_light_wallpaper.stdout | trim | regex_replace("(^'|'$)", "")) !=
      "file://" ~ workstation_home ~ "/Pictures/mrdemonwolf-desktop-wallpaper.png"

- name: Read the current GNOME dark wallpaper
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.desktop.background, picture-uri-dark]
  register: gnome_dark_wallpaper
  changed_when: false
  when: "'GNOME' in (ansible_facts.env.XDG_CURRENT_DESKTOP | default(''))"

- name: Set the supplied wallpaper in GNOME dark mode
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.desktop.background
      - picture-uri-dark
      - "'file://{{ workstation_home }}/Pictures/mrdemonwolf-desktop-wallpaper.png'"
  when:
    - "'GNOME' in (ansible_facts.env.XDG_CURRENT_DESKTOP | default(''))"
    - >-
      (gnome_dark_wallpaper.stdout | trim | regex_replace("(^'|'$)", "")) !=
      "file://" ~ workstation_home ~ "/Pictures/mrdemonwolf-desktop-wallpaper.png"

- name: Install checksum-pinned Chrome web-app icons and launchers
  ansible.builtin.import_tasks: chrome_web_apps.yml

- name: Install the ChatGPT Chrome app-window shortcut
  ansible.builtin.import_tasks: chatgpt_launcher.yml
