---
- name: Verify the checked-in Plymouth theme and supplied logo
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/{{ item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - { path: themes/mrdemonwolf.plymouth, sha256: "{{ plymouth_theme_sha256 }}" }
    - { path: assets/mrdemonwolf-plymouth-logo.png, sha256: "{{ plymouth_logo_sha256 }}" }
  register: plymouth_source_assets

- name: Refuse changed or unsafe Plymouth source assets
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.checksum == item.item.sha256
    fail_msg: "The reviewed Plymouth theme asset is missing or has changed: {{ item.item.path }}"
    quiet: true
  loop: "{{ plymouth_source_assets.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Inspect Plymouth and systemd-boot prerequisites
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - { path: /usr/share/plymouth/themes/spinner }
    - { path: /etc/kernel/cmdline }
    - { path: /usr/bin/reinstall-kernels }
    - { path: /etc/plymouth/plymouthd.conf }
  register: branding_prerequisites

- name: Require the installed Plymouth theme and configuration
  ansible.builtin.assert:
    that:
      - branding_prerequisites.results[0].stat.isdir | default(false)
      - not (branding_prerequisites.results[0].stat.islnk | default(false))
      - branding_prerequisites.results[3].stat.isreg | default(false)
      - not (branding_prerequisites.results[3].stat.islnk | default(false))
    fail_msg: "Plymouth files are missing. Run ./setup.sh apps to install Plymouth, then retry ./setup.sh branding."
    quiet: true

- name: Require the systemd-boot kernel command line
  ansible.builtin.assert:
    that:
      - branding_prerequisites.results[1].stat.isreg | default(false)
      - not (branding_prerequisites.results[1].stat.islnk | default(false))
    fail_msg: "The installer’s systemd-boot command line is missing at /etc/kernel/cmdline. Keep systemd-boot selected and use EndeavourOS automatic disk setup; the setup will not guess your root or LUKS options."
    quiet: true

- name: Require EndeavourOS systemd-boot kernel rebuild support
  ansible.builtin.assert:
    that:
      - branding_prerequisites.results[2].stat.executable | default(false)
    fail_msg: "The systemd-boot kernel helper is missing. Run ./setup.sh apps to install kernel-install-for-dracut, then retry ./setup.sh branding."
    quiet: true

- name: Read the current systemd-boot kernel command line
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: systemd_boot_cmdline

- name: Preserve the installed root and encryption boot options
  ansible.builtin.assert:
    that:
      - "'root=' in (systemd_boot_cmdline.content | b64decode | trim)"
      - "'\n' not in (systemd_boot_cmdline.content | b64decode | trim)"
    fail_msg: "Refusing to edit an unexpected /etc/kernel/cmdline; keep its existing root and LUKS options intact."
    quiet: true

- name: Inspect the custom Plymouth theme destination
  ansible.builtin.stat:
    path: /usr/share/plymouth/themes/mrdemonwolf
    follow: false
  register: mrdemonwolf_theme_dir

- name: Refuse an unsafe custom Plymouth theme destination
  ansible.builtin.assert:
    that:
      - not (mrdemonwolf_theme_dir.stat.islnk | default(false))
      - not (mrdemonwolf_theme_dir.stat.exists | default(false)) or mrdemonwolf_theme_dir.stat.isdir | default(false)
    fail_msg: "Refusing an unsafe Plymouth theme path: /usr/share/plymouth/themes/mrdemonwolf"
    quiet: true

- name: Inspect existing files owned by the MrDemonWolf Plymouth theme
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - { path: /usr/share/plymouth/themes/mrdemonwolf/mrdemonwolf.plymouth, sha256: "{{ plymouth_theme_sha256 }}" }
    - { path: /usr/share/plymouth/themes/mrdemonwolf/watermark.png, sha256: "{{ plymouth_logo_sha256 }}" }
  register: mrdemonwolf_theme_files

- name: Refuse unknown or unsafe existing MrDemonWolf theme files
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isreg | default(false) and
         (item.stat.checksum == item.item.sha256 or
          (item.item.path == '/usr/share/plymouth/themes/mrdemonwolf/mrdemonwolf.plymouth' and
           item.stat.checksum in plymouth_previous_theme_sha256s)))
    fail_msg: "Refusing unknown or modified MrDemonWolf Plymouth theme file: {{ item.item.path }}. If an earlier branding run was interrupted, review and remove that file, then rerun ./setup.sh branding."
    quiet: true
  loop: "{{ mrdemonwolf_theme_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Refuse an existing unmarked MrDemonWolf theme directory
  ansible.builtin.assert:
    that:
      - >-
        not (mrdemonwolf_theme_dir.stat.exists | default(false)) or
        (mrdemonwolf_theme_files.results[0].stat.isreg | default(false) and
         mrdemonwolf_theme_files.results[0].stat.checksum in ([plymouth_theme_sha256] + plymouth_previous_theme_sha256s) and
         mrdemonwolf_theme_files.results[1].stat.isreg | default(false) and
         mrdemonwolf_theme_files.results[1].stat.checksum == plymouth_logo_sha256)
    fail_msg: "The existing Plymouth theme directory has no matching MrDemonWolf theme markers."
    quiet: true

- name: Ensure the separate MrDemonWolf Plymouth theme directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/mrdemonwolf
    state: directory
    mode: "0755"

- name: Install the MrDemonWolf two-step theme descriptor
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/themes/mrdemonwolf.plymouth"
    dest: /usr/share/plymouth/themes/mrdemonwolf/mrdemonwolf.plymouth
    mode: "0644"

- name: Install the supplied logo as the theme watermark
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/mrdemonwolf-plymouth-logo.png"
    dest: /usr/share/plymouth/themes/mrdemonwolf/watermark.png
    mode: "0644"

- name: Find the packaged spinner assets except its watermark
  ansible.builtin.find:
    paths: /usr/share/plymouth/themes/spinner
    file_type: file
    excludes: [watermark.png]
  register: spinner_asset_files

# Copy per file so the stock watermark never replaces the branded logo, even briefly.
- name: Copy the packaged spinner assets into the separate local theme
  become: true
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/usr/share/plymouth/themes/mrdemonwolf/{{ item.path | basename }}"
    remote_src: true
    mode: preserve
  loop: "{{ spinner_asset_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Inspect the custom dracut configuration path
  become: true
  ansible.builtin.stat:
    path: /etc/dracut.conf.d/99-mrdemonwolf-plymouth.conf
    checksum_algorithm: sha256
    follow: false
  register: dracut_brand_config

- name: Refuse an unsafe or conflicting dracut branding configuration
  ansible.builtin.assert:
    that:
      - not (dracut_brand_config.stat.islnk | default(false))
      - >-
        not (dracut_brand_config.stat.exists | default(false)) or
        (dracut_brand_config.stat.isreg | default(false) and
         dracut_brand_config.stat.checksum == dracut_plymouth_config_sha256)
    fail_msg: "Refusing an unknown /etc/dracut.conf.d/99-mrdemonwolf-plymouth.conf file."
    quiet: true

- name: Ensure the dracut configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/dracut.conf.d
    state: directory
    mode: "0755"

- name: Add Plymouth to generated dracut initramfs images
  become: true
  ansible.builtin.copy:
    content: |
      add_dracutmodules+=" plymouth "
    dest: /etc/dracut.conf.d/99-mrdemonwolf-plymouth.conf
    mode: "0644"

- name: Read the currently selected Plymouth theme
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/plymouth-set-default-theme]
  register: current_plymouth_theme
  changed_when: false

- name: Select the MrDemonWolf theme through Plymouth
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/plymouth-set-default-theme, mrdemonwolf]
  when: current_plymouth_theme.stdout | trim != 'mrdemonwolf'
  changed_when: true

- name: Confirm Plymouth resolves the custom theme
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/plymouth-set-default-theme]
  register: resolved_plymouth_theme
  changed_when: false

- name: Require Plymouth to resolve the custom theme name
  ansible.builtin.assert:
    that:
      - resolved_plymouth_theme.stdout | trim == 'mrdemonwolf'
    fail_msg: "Plymouth is not resolving the MrDemonWolf theme. The boot splash will not use the custom logo."
    quiet: true

- name: Add quiet branded splash parameters without replacing existing boot options
  become: true
  ansible.builtin.lineinfile:
    path: /etc/kernel/cmdline
    regexp: '^(?!.*(?:^|\s){{ item }}(?:\s|$))(.*)$'
    line: '\1 {{ item }}'
    backrefs: true
  loop: [quiet, splash]

# Rebuild on every branding run so a rerun repairs boot images after an earlier rebuild failed.
- name: Rebuild systemd-boot entries and initramfs images for both installed kernels
  become: true
  ansible.builtin.command:
    argv: [/usr/bin/reinstall-kernels]
  changed_when: true
