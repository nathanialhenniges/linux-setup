---
- name: Require an active GNOME session for personal dock settings
  ansible.builtin.assert:
    that:
      - "'GNOME' in (ansible_facts.env.XDG_CURRENT_DESKTOP | default(''))"
    fail_msg: "Log in to GNOME, then rerun ./setup.sh gnome-dock from its terminal."
    quiet: true

- name: Find installed applications for the dock
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  loop: "{{ gnome_dock_favorites }}"
  register: gnome_dock_desktop_files

- name: Keep only installed app shortcuts in dock favorites
  ansible.builtin.set_fact:
    gnome_dock_available_ids: >-
      {{ gnome_dock_desktop_files.results
         | selectattr('stat.isreg', 'defined')
         | selectattr('stat.isreg', 'equalto', true)
         | map(attribute='item.desktop_id')
         | list }}

- name: Require the core dock applications
  ansible.builtin.assert:
    that:
      - "'org.gnome.Nautilus.desktop' in gnome_dock_available_ids"
      - "'google-chrome.desktop' in gnome_dock_available_ids"
      - "'discord.desktop' in gnome_dock_available_ids"
    fail_msg: "GNOME Files, Google Chrome, or Discord is missing. Run ./setup.sh apps and ./setup.sh desktop first."
    quiet: true

- name: Read current GNOME dock favorites
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.shell, favorite-apps]
  register: current_gnome_favorites
  changed_when: false

- name: Read currently registered GNOME custom shortcuts
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.settings-daemon.plugins.media-keys, custom-keybindings]
  register: current_gnome_custom_keybindings
  changed_when: false

- name: Preserve existing custom shortcuts and add the setup terminal shortcut
  ansible.builtin.set_fact:
    gnome_registered_custom_keybinding_paths: >-
      {{ ((current_gnome_custom_keybindings.stdout
           | replace('@as ', '')
           | from_yaml)
          + gnome_custom_keybinding_paths)
         | unique
         | list }}

- name: Check which configured GNOME settings this version supports
  ansible.builtin.command:
    argv: [gsettings, range, "{{ item.schema }}", "{{ item.key }}"]
  loop: "{{ gnome_personalization_preferences }}"
  register: gnome_preference_ranges
  changed_when: false
  failed_when: false

- name: Report GNOME settings unavailable in this version
  ansible.builtin.debug:
    msg: "Skipping unavailable GSettings key {{ item.item.schema }} {{ item.item.key }}."
  loop: "{{ gnome_preference_ranges.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Keep only GNOME settings available in this version
  ansible.builtin.set_fact:
    gnome_supported_preferences: >-
      {{ gnome_preference_ranges.results
         | selectattr('rc', 'equalto', 0)
         | map(attribute='item')
         | list }}

- name: Read current GNOME appearance and shortcut preferences
  ansible.builtin.command:
    argv: [gsettings, get, "{{ item.schema }}", "{{ item.key }}"]
  loop: "{{ gnome_supported_preferences }}"
  register: current_gnome_personalization
  changed_when: false

- name: Register the GNOME terminal shortcut
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.settings-daemon.plugins.media-keys
      - custom-keybindings
      - "[{% for path in gnome_registered_custom_keybinding_paths %}'{{ path }}'{% if not loop.last %}, {% endif %}{% endfor %}]"
  when: current_gnome_custom_keybindings.stdout | trim != "[{% for path in gnome_registered_custom_keybinding_paths %}'{{ path }}'{% if not loop.last %}, {% endif %}{% endfor %}]"

- name: Set the Mac-inspired GNOME app order
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.shell
      - favorite-apps
      - "[{% for desktop_id in gnome_dock_available_ids %}'{{ desktop_id }}'{% if not loop.last %}, {% endif %}{% endfor %}]"
  when: current_gnome_favorites.stdout | trim != "[{% for desktop_id in gnome_dock_available_ids %}'{{ desktop_id }}'{% if not loop.last %}, {% endif %}{% endfor %}]"

- name: Apply the lightweight GNOME appearance and familiar shortcuts
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - "{{ item.item.schema }}"
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  loop: "{{ current_gnome_personalization.results }}"
  when: (item.stdout | trim | replace('@as ', '')) != item.item.value
  loop_control:
    label: "{{ item.item.key }}"

- name: Read workspace and app-number shortcuts previously changed by this setup
  ansible.builtin.command:
    argv: [gsettings, get, "{{ item.schema }}", "{{ item.key }}"]
  loop: "{{ gnome_previous_workspace_preferences }}"
  register: previous_gnome_workspace_preferences
  changed_when: false
  failed_when: false

- name: Restore those GNOME shortcuts to this version's defaults
  ansible.builtin.command:
    argv: [gsettings, reset, "{{ item.item.schema }}", "{{ item.item.key }}"]
  loop: "{{ previous_gnome_workspace_preferences.results }}"
  when:
    - item.rc == 0
    - (item.stdout | trim | replace('@as ', '')) == item.item.previous_value
  loop_control:
    label: "{{ item.item.key }}"

- name: Read GNOME extensions configured for this user
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.shell, enabled-extensions]
  register: configured_gnome_extensions
  changed_when: false

- name: Require the installed AppIndicator extension for LibrePods tray support
  ansible.builtin.stat:
    path: /usr/share/gnome-shell/extensions/appindicatorsupport@rgcjonas.gmail.com/metadata.json
    follow: false
  register: appindicator_extension_file

- name: Require the AppIndicator extension package
  ansible.builtin.assert:
    that:
      - appindicator_extension_file.stat.isreg | default(false)
    fail_msg: "Install the reviewed AppIndicator support package with ./setup.sh apps, then rerun ./setup.sh gnome-dock."
    quiet: true

- name: Preserve current extensions and queue the tray and dock extensions
  ansible.builtin.set_fact:
    gnome_configured_extension_ids: >-
      {{ configured_gnome_extensions.stdout
         | replace('@as ', '')
         | from_yaml }}
    gnome_desired_extension_ids: >-
      {{ ((configured_gnome_extensions.stdout
           | replace('@as ', '')
           | from_yaml)
          + gnome_required_extensions)
         | unique
         | list }}

- name: Save GNOME extensions for the next login
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.shell
      - enabled-extensions
      - "[{% for extension_id in gnome_desired_extension_ids %}'{{ extension_id }}'{% if not loop.last %}, {% endif %}{% endfor %}]"
  when: gnome_required_extensions | difference(gnome_configured_extension_ids) | length > 0
  register: configured_gnome_extension_update
  changed_when: configured_gnome_extension_update.rc == 0

- name: Read current Dash to Dock preferences
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.shell.extensions.dash-to-dock, "{{ item.key }}"]
  loop:
    - { key: dock-position, value: "'BOTTOM'" }
    - { key: dock-fixed, value: "true" }
    - { key: autohide, value: "false" }
    - { key: intellihide, value: "false" }
    - { key: extend-height, value: "false" }
    - { key: dash-max-icon-size, value: "40" }
    - { key: transparency-mode, value: "'FIXED'" }
    - { key: background-opacity, value: "0.72" }
    - { key: custom-background-color, value: "true" }
    - { key: background-color, value: "'#3a2515'" }
    - { key: show-show-apps-button, value: "false" }
    - { key: show-trash, value: "true" }
    - { key: hot-keys, value: "false" }
    - { key: shortcut, value: "[]" }
  register: current_dock_preferences
  changed_when: false

- name: Apply the floating bottom dock appearance
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - org.gnome.shell.extensions.dash-to-dock
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  loop: "{{ current_dock_preferences.results }}"
  when: (item.stdout | trim | replace('@as ', '')) != item.item.value
  loop_control:
    label: "{{ item.item.key }}"
