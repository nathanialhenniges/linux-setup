---
- name: Require packaged Chrome and inspect managed app paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: "{{ item.follow | default(false) }}"
  loop:
    - { path: /usr/bin/google-chrome-stable, follow: true }
    - { path: "{{ workstation_home }}/.local/share/applications" }
    - { path: "{{ workstation_home }}/.local/share/icons" }
  register: chrome_web_app_prerequisites

- name: Require packaged Chrome and safe local app directories
  ansible.builtin.assert:
    that:
      - chrome_web_app_prerequisites.results[0].stat.isreg | default(false)
      - chrome_web_app_prerequisites.results[0].stat.executable | default(false)
      - not (chrome_web_app_prerequisites.results[1].stat.islnk | default(false))
      - not (chrome_web_app_prerequisites.results[1].stat.exists | default(false)) or chrome_web_app_prerequisites.results[1].stat.isdir | default(false)
      - not (chrome_web_app_prerequisites.results[2].stat.islnk | default(false))
      - not (chrome_web_app_prerequisites.results[2].stat.exists | default(false)) or chrome_web_app_prerequisites.results[2].stat.isdir | default(false)
    fail_msg: "Google Chrome or a safe local applications/icons directory is missing."
    quiet: true

- name: Inspect managed Chrome launcher paths
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/share/applications/{{ item.desktop_id }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ chrome_web_app_launchers }}"
  loop_control:
    label: "{{ item.desktop_id }}"
  register: chrome_web_app_paths

- name: Refuse unknown or unsafe managed Chrome launcher files
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isreg | default(false) and
         (item.stat.checksum == (lookup('ansible.builtin.template', 'chrome-web-app.desktop.j2') | hash('sha256')) or
          item.stat.checksum == (lookup('ansible.builtin.template', 'chrome-web-app-legacy.desktop.j2') | hash('sha256'))))
    fail_msg: "Refusing unknown managed Chrome launcher: {{ item.item.desktop_id }}"
    quiet: true
  vars:
    chrome_web_app: "{{ item.item }}"
  loop: "{{ chrome_web_app_paths.results }}"
  loop_control:
    label: "{{ item.item.desktop_id }}"

- name: Inspect the exact retired Google Drive launcher
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/share/applications/{{ item.desktop_id }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ chrome_web_app_retired_launchers }}"
  loop_control:
    label: "{{ item.desktop_id }}"
  register: retired_web_app_paths

- name: Refuse unknown retired launcher content
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isreg | default(false) and
         item.stat.checksum == (lookup('ansible.builtin.template', 'chrome-web-app-legacy.desktop.j2') | hash('sha256')))
    fail_msg: "Refusing unknown retired Chrome launcher: {{ item.item.desktop_id }}"
    quiet: true
  vars:
    chrome_web_app: "{{ item.item }}"
  loop: "{{ retired_web_app_paths.results }}"
  loop_control:
    label: "{{ item.item.desktop_id }}"

- name: Inspect official Chrome icon paths
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/share/icons/{{ item.icon_file }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ chrome_web_app_launchers }}"
  loop_control:
    label: "{{ item.icon_file }}"
  register: chrome_icon_paths

- name: Refuse unknown content at managed Chrome icon paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or (item.stat.isreg | default(false) and item.stat.checksum == item.item.icon_sha256)
    fail_msg: "Refusing unknown Chrome app icon: {{ item.item.icon_file }}"
    quiet: true
  loop: "{{ chrome_icon_paths.results }}"
  loop_control:
    label: "{{ item.item.icon_file }}"

- name: Download checksum-pinned icons from their official sites
  when: not ansible_check_mode
  block:
    - name: Download each reviewed Chrome app icon
      ansible.builtin.get_url:
        url: "{{ item.icon_url }}"
        dest: "{{ workstation_home }}/.local/share/icons/{{ item.icon_file }}"
        checksum: "sha256:{{ item.icon_sha256 }}"
        mode: "0644"
      loop: "{{ chrome_web_app_launchers }}"
      loop_control:
        label: "{{ item.name }}"
  rescue:
    - name: Explain a changed or unreachable vendor icon
      ansible.builtin.fail:
        msg: >-
          The {{ ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item.name') | join(', ') | default('Chrome app', true) }} icon could not be downloaded
          or no longer matches its reviewed pin. Check your network first. If the vendor changed its icon,
          review the new file at its official URL, then update icon_sha256 in vars.yml and THIRD-PARTY-NOTICES.md
          together before rerunning ./setup.sh desktop.

- name: Install the reviewed Chrome app-window launchers
  ansible.builtin.template:
    src: chrome-web-app.desktop.j2
    dest: "{{ workstation_home }}/.local/share/applications/{{ item.desktop_id }}"
    mode: "0644"
  vars:
    chrome_web_app: "{{ item }}"
  loop: "{{ chrome_web_app_launchers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove only the exact retired Google Drive app launcher
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/applications/{{ item.desktop_id }}"
    state: absent
  loop: "{{ chrome_web_app_retired_launchers }}"
  loop_control:
    label: "{{ item.desktop_id }}"
