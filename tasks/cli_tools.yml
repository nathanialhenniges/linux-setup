---
- name: Calculate missing Ubuntu CLI packages
  ansible.builtin.set_fact:
    missing_tool_packages: "{{ tool_packages | difference(ansible_facts.packages.keys() | list) }}"

- name: Inspect local commands that would shadow APT
  ansible.builtin.stat:
    path: "{{ item.1.path }}/{{ item.0.command }}"
    follow: false
  loop: "{{ apt_tool_commands | product(apt_tool_shadow_dirs) | list }}"
  register: apt_tool_shadow_paths
  loop_control:
    label: "{{ item.1.path }}/{{ item.0.command }}"

- name: Refuse unsafe local command shadows
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        item.stat.isreg | default(false) or
        item.stat.islnk | default(false)
    fail_msg: >-
      {{ item.item.1.path }}/{{ item.item.0.command }} is not a regular file or symlink.
      Move it manually before replacing this command with Ubuntu APT.
    quiet: true
  loop: "{{ apt_tool_shadow_paths.results }}"
  loop_control:
    label: "{{ item.item.1.path }}/{{ item.item.0.command }}"

- name: Preview the selected APT tool install
  ansible.builtin.debug:
    msg:
      - "Would install Ubuntu packages: {{ missing_tool_packages | join(', ') if missing_tool_packages | length > 0 else 'none' }}"
      - "Would remove matching commands from ~/.local/bin after APT verification."
      - "Would rename matches in ~/bin or /usr/local/bin to timestamped .pre-linux-setup-apt backups."
      - "Would then require every command to resolve to its Ubuntu APT path."
      - "Twitch CLI is unavailable from Ubuntu APT and will not be installed."
      - "Would not configure accounts, credentials, scans, mirrors, SMART tests, or tokens."
  changed_when: >-
    missing_tool_packages | length > 0 or
    (apt_tool_shadow_paths.results | selectattr('stat.exists') | list | length > 0)
  when: ansible_check_mode

- name: Install all selected tools from Ubuntu APT
  ansible.builtin.apt:
    name: "{{ tool_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    fail_on_autoremove: true
    allow_unauthenticated: false
  become: true
  when: not ansible_check_mode

- name: Refresh package facts after the APT install
  ansible.builtin.package_facts:
    manager: apt
  when: not ansible_check_mode

- name: Require every selected Ubuntu package before moving shadows
  ansible.builtin.assert:
    that:
      - tool_packages | difference(ansible_facts.packages.keys() | list) | length == 0
    fail_msg: "One or more selected Ubuntu CLI packages did not install; local commands were left untouched."
    quiet: true
  when: not ansible_check_mode

- name: Read the APT owner of every selected command path
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --search
      - "{{ item.apt_path }}"
  loop: "{{ apt_tool_commands }}"
  register: apt_tool_path_owners
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.apt_path }}"
  when: not ansible_check_mode

- name: Inspect every selected APT command path
  ansible.builtin.stat:
    path: "{{ item.apt_path }}"
    follow: true
  loop: "{{ apt_tool_commands }}"
  register: apt_tool_path_files
  loop_control:
    label: "{{ item.apt_path }}"
  when: not ansible_check_mode

- name: Require APT ownership before replacing local shadows
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.stdout_lines |
        select('match', '^' ~ item.item.package ~ '(:[^: ]+)?[:] ' ~ item.item.apt_path ~ '$') |
        list | length > 0
    fail_msg: >-
      {{ item.item.apt_path }} is not owned by Ubuntu package {{ item.item.package }};
      local commands were left untouched.
    quiet: true
  loop: "{{ apt_tool_path_owners.results }}"
  loop_control:
    label: "{{ item.item.apt_path }}"
  when: not ansible_check_mode

- name: Require working APT commands before replacing local shadows
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.executable | default(false)
    fail_msg: >-
      {{ item.item.apt_path }} is not a working executable; local commands were left untouched.
    quiet: true
  loop: "{{ apt_tool_path_files.results }}"
  loop_control:
    label: "{{ item.item.apt_path }}"
  when: not ansible_check_mode

- name: Clean obsolete user-local backups from the previous migration policy
  ansible.builtin.include_tasks: cleanup_legacy_apt_backups.yml

- name: Replace local command shadows after APT verification
  ansible.builtin.include_tasks: migrate_apt_shadow.yml
  loop: "{{ apt_tool_shadow_paths.results }}"
  loop_control:
    loop_var: apt_shadow
    label: "{{ apt_shadow.item.1.path }}/{{ apt_shadow.item.0.command }}"
  when:
    - not ansible_check_mode
    - apt_shadow.stat.exists | default(false)

- name: Resolve every selected command after migration
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'resolved=$(command -v "$1") && /usr/bin/realpath --canonicalize-existing -- "$resolved"'
      - sh
      - "{{ item.command }}"
  environment:
    PATH: >-
      {{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.HOME }}/bin:/usr/local/bin:{{ ansible_facts.env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', true) }}
  loop: "{{ apt_tool_commands }}"
  register: resolved_apt_tool_commands
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.command }}"
  when: not ansible_check_mode

- name: Require every selected command to use Ubuntu APT
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout == item.item.apt_path
    fail_msg: >-
      {{ item.item.command }} resolves to {{ item.stdout | default('nothing', true) }}, not
      {{ item.item.apt_path }}. Remove it with its original package manager, then rerun tools.
    quiet: true
  loop: "{{ resolved_apt_tool_commands.results }}"
  loop_control:
    label: "{{ item.item.command }}"
  when: not ansible_check_mode

- name: Keep CLI account setup and active operations manual
  ansible.builtin.debug:
    msg: >-
      {{ "Previewed selected CLI tools only" if ansible_check_mode else "Installed selected CLI tools from Ubuntu APT only" }}.
      AWS, rclone, scans, mirrors, SMART tests, and credentials remain untouched.
