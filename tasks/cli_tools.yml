---
- name: Calculate missing Ubuntu CLI packages
  ansible.builtin.set_fact:
    missing_tool_packages: "{{ tool_packages | difference(ansible_facts.packages.keys() | list) }}"

- name: Inspect legacy user-local APT shadows
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ legacy_user_tool_files }}"
  register: legacy_user_tool_paths
  loop_control:
    label: "{{ item.path }}"

- name: Refuse unknown user-local APT shadows
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or item.stat.isreg | default(false)
      - not (item.stat.exists | default(false)) or not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.checksum | default('') == item.item.sha256
    fail_msg: >-
      {{ item.item.path }} is not the reviewed legacy linux-setup file. Move or remove it manually,
      then rerun the tools action so Ubuntu's package can own this command.
    quiet: true
  loop: "{{ legacy_user_tool_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Preview the selected APT tool install
  ansible.builtin.debug:
    msg:
      - "Would install Ubuntu packages: {{ missing_tool_packages | join(', ') if missing_tool_packages | length > 0 else 'none' }}"
      - "Would remove reviewed user-local rclone or yt-dlp files only after their Ubuntu packages install successfully."
      - "Twitch CLI is unavailable from Ubuntu APT and will not be installed."
      - "Would not configure accounts, credentials, scans, mirrors, SMART tests, or tokens."
  changed_when: >-
    missing_tool_packages | length > 0 or
    (legacy_user_tool_paths.results | selectattr('stat.exists') | list | length > 0)
  when: ansible_check_mode

- name: Install all selected tools from Ubuntu APT
  ansible.builtin.apt:
    name: "{{ tool_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    fail_on_autoremove: true
    allow_unauthenticated: false
  become: true
  when: not ansible_check_mode

- name: Refresh package facts after the APT install
  ansible.builtin.package_facts:
    manager: apt
  when: not ansible_check_mode

- name: Require every selected Ubuntu package
  ansible.builtin.assert:
    that:
      - tool_packages | difference(ansible_facts.packages.keys() | list) | length == 0
    fail_msg: "One or more selected Ubuntu CLI packages did not install."
    quiet: true
  when: not ansible_check_mode

- name: Remove reviewed user-local files that shadow APT
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ legacy_user_tool_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - not ansible_check_mode
    - item.stat.exists | default(false)

- name: Keep CLI account setup and active operations manual
  ansible.builtin.debug:
    msg: >-
      {{ "Previewed selected CLI tools only" if ansible_check_mode else "Installed selected CLI tools from Ubuntu APT only" }}.
      AWS, rclone, scans, mirrors, SMART tests, and credentials remain untouched.
