---
- name: Inspect the isolated APT keyring directory
  ansible.builtin.stat:
    path: /etc/apt/keyrings
    follow: false
  register: apt_keyring_directory

- name: Require a safe isolated APT keyring directory
  ansible.builtin.assert:
    that:
      - not (apt_keyring_directory.stat.islnk | default(false))
      - >-
        not (apt_keyring_directory.stat.exists | default(false)) or
        apt_keyring_directory.stat.isdir | default(false)
    fail_msg: "/etc/apt/keyrings must be absent or a real directory."
    quiet: true

- name: Inspect Claude's repository opt-out file
  ansible.builtin.stat:
    path: "{{ claude_repository_opt_out_path }}"
    follow: false
  register: claude_repository_opt_out

- name: Refuse an unsafe Claude repository opt-out path
  ansible.builtin.assert:
    that:
      - not (claude_repository_opt_out.stat.islnk | default(false))
      - >-
        not (claude_repository_opt_out.stat.exists | default(false)) or
        claude_repository_opt_out.stat.isreg | default(false)
    fail_msg: "Refusing unsafe Claude repository opt-out: {{ claude_repository_opt_out_path }}"
    quiet: true

- name: Require safe Claude repository opt-out ownership and mode
  ansible.builtin.assert:
    that:
      - not (claude_repository_opt_out.stat.exists | default(false)) or claude_repository_opt_out.stat.uid == 0
      - >-
        not (claude_repository_opt_out.stat.exists | default(false)) or
        claude_repository_opt_out.stat.mode == '0644'
    fail_msg: "Refusing unsafe ownership or mode on {{ claude_repository_opt_out_path }}."
    quiet: true

- name: Read Claude's repository opt-out file
  ansible.builtin.slurp:
    src: "{{ claude_repository_opt_out_path }}"
  register: claude_repository_opt_out_content
  changed_when: false
  when: claude_repository_opt_out.stat.isreg | default(false)

- name: Refuse unsafe content in Claude's repository opt-out file
  ansible.builtin.assert:
    that:
      - >-
        (claude_repository_opt_out_content.content | b64decode) in
        ['', claude_repository_opt_out_line, claude_repository_opt_out_line ~ '\n']
    fail_msg: >-
      Refusing unsafe content in {{ claude_repository_opt_out_path }}.
      Found {{ (claude_repository_opt_out_content.content | b64decode).splitlines() | length }} line(s),
      SHA-256 {{ claude_repository_opt_out_content.content | b64decode | hash('sha256') }}.
      This file is sourced as root by Claude's package; leave it untouched and report this complete message.
    quiet: true
  when: claude_repository_opt_out.stat.isreg | default(false)

- name: Inspect Anthropic's alternate Claude source
  ansible.builtin.stat:
    path: "{{ claude_official_source_path }}"
    follow: false
  register: claude_official_source

- name: Refuse an unsafe alternate Claude source path
  ansible.builtin.assert:
    that:
      - not (claude_official_source.stat.islnk | default(false))
      - >-
        not (claude_official_source.stat.exists | default(false)) or
        claude_official_source.stat.isreg | default(false)
    fail_msg: "Refusing unsafe alternate Claude source: {{ claude_official_source_path }}"
    quiet: true

- name: Read Anthropic's alternate Claude source
  ansible.builtin.slurp:
    src: "{{ claude_official_source_path }}"
  register: claude_official_source_content
  changed_when: false
  when: claude_official_source.stat.isreg | default(false)

- name: Require Anthropic's exact alternate Claude source
  ansible.builtin.assert:
    that:
      - (claude_official_source_content.content | b64decode | trim) in claude_official_source_lines
    fail_msg: >-
      Refusing to replace unexpected content in {{ claude_official_source_path }}.
      Found {{ (claude_official_source_content.content | b64decode).splitlines() | length }} line(s),
      SHA-256 {{ claude_official_source_content.content | b64decode | hash('sha256') }}.
      Leave it untouched and report this complete message before rerunning setup.
    quiet: true
  when: claude_official_source.stat.isreg | default(false)

- name: Preview removal of Anthropic's duplicate Claude source
  ansible.builtin.debug:
    msg: "Would remove the exact duplicate Claude source: {{ claude_official_source_path }}"
  changed_when: true
  when:
    - ansible_check_mode
    - claude_official_source.stat.isreg | default(false)

- name: Discover active Claude entries in other APT list files
  ansible.builtin.shell: |
    set -Eeuo pipefail
    shopt -s nullglob
    pattern='^[[:space:]]*deb(-src)?[[:space:]].*https://downloads\.claude\.ai/claude-desktop/apt/stable'
    for path in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
      [[ -e "$path" || -L "$path" ]] || continue
      [[ -f "$path" ]] || continue
      if grep -Eq "$pattern" "$path"; then
        printf '%s\n' "$path"
      else
        result=$?
        [[ "$result" -eq 1 ]] || exit "$result"
      fi
    done
  args:
    executable: /bin/bash
  register: claude_active_list_scan
  changed_when: false

- name: Discover Claude entries in unmanaged deb822 sources
  ansible.builtin.shell: |
    set -Eeuo pipefail
    shopt -s nullglob
    for path in /etc/apt/sources.list.d/*.sources; do
      [[ "$path" != "{{ claude_managed_source_path }}" ]] || continue
      [[ -e "$path" || -L "$path" ]] || continue
      [[ -f "$path" ]] || continue
      if grep -Fq '{{ claude_repository_uri }}' "$path"; then
        printf '%s\n' "$path"
      else
        result=$?
        [[ "$result" -eq 1 ]] || exit "$result"
      fi
    done
  args:
    executable: /bin/bash
  register: claude_unmanaged_deb822_scan
  changed_when: false

- name: Inspect unmanaged Claude deb822 sources
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ claude_unmanaged_deb822_scan.stdout_lines | unique | list }}"
  register: claude_unmanaged_deb822_sources

- name: Refuse unsafe unmanaged Claude deb822 paths
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: "Refusing unsafe unmanaged Claude deb822 source: {{ item.item }}"
    quiet: true
  loop: "{{ claude_unmanaged_deb822_sources.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read unmanaged Claude deb822 sources
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ claude_unmanaged_deb822_scan.stdout_lines | unique | list }}"
  register: claude_unmanaged_deb822_content
  changed_when: false

- name: Refuse unmanaged Claude deb822 sources
  ansible.builtin.assert:
    that: false
    fail_msg: >-
      Refusing unmanaged Claude deb822 source {{ item.item }}.
      Found {{ (item.content | b64decode).splitlines() | length }} line(s),
      SHA-256 {{ item.content | b64decode | hash('sha256') }}.
      It is not a reviewed Anthropic layout; leave it untouched and report this complete message.
    quiet: true
  loop: "{{ claude_unmanaged_deb822_content.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Select additional Claude APT list files
  ansible.builtin.set_fact:
    claude_additional_source_paths: >-
      {{ claude_active_list_scan.stdout_lines
         | reject('equalto', claude_official_source_path)
         | unique | list }}

- name: Inspect additional Claude APT list files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ claude_additional_source_paths }}"
  register: claude_additional_sources

- name: Refuse unsafe additional Claude APT list files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: "Refusing unsafe Claude APT source: {{ item.item }}"
    quiet: true
  loop: "{{ claude_additional_sources.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read additional Claude APT list files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ claude_additional_source_paths }}"
  register: claude_additional_source_content
  changed_when: false

- name: Require exact Claude entries in additional APT list files
  ansible.builtin.assert:
    that:
      - >-
        (item.content | b64decode).splitlines()
        | reject('match', '^[ \t]*#')
        | select('search', claude_repository_uri)
        | list | difference(claude_official_source_lines) | length == 0
    fail_msg: >-
      Refusing unexpected Claude content in {{ item.item }}.
      Found {{ (item.content | b64decode).splitlines() | length }} line(s),
      SHA-256 {{ item.content | b64decode | hash('sha256') }}.
      Leave it untouched and report this complete message before rerunning setup.
    quiet: true
  loop: "{{ claude_additional_source_content.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Preview verified Claude entry removal from additional list files
  ansible.builtin.debug:
    msg: "Would remove only the verified Claude entry from: {{ item }}"
  changed_when: true
  loop: "{{ claude_additional_source_paths }}"
  when: ansible_check_mode

- name: Preview Claude package repository opt-out
  ansible.builtin.debug:
    msg: "Would install exact repository opt-out: {{ claude_repository_opt_out_path }}"
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      not (claude_repository_opt_out.stat.isreg | default(false)) or
      (claude_repository_opt_out_content.content | default('') | b64decode) != (claude_repository_opt_out_line ~ '\n')

- name: Install Claude package repository opt-out as exact content
  ansible.builtin.copy:
    dest: "{{ claude_repository_opt_out_path }}"
    content: "{{ claude_repository_opt_out_line }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not ansible_check_mode

- name: Inspect installed vendor signing keys
  ansible.builtin.stat:
    path: "{{ item.key_path }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ vendor_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: installed_vendor_keys

- name: Inspect installed vendor sources
  ansible.builtin.stat:
    path: "{{ item.source_path }}"
    follow: false
  loop: "{{ vendor_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: installed_vendor_sources

- name: Read installed vendor source content
  ansible.builtin.slurp:
    src: "{{ item.source_path }}"
  loop: "{{ vendor_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: installed_vendor_source_content
  failed_when: false
  changed_when: false

- name: Refuse unsafe installed vendor signing-key paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        item.stat.isreg | default(false)
    fail_msg: "Refusing unsafe vendor signing-key path: {{ item.item.key_path }}"
    quiet: true
  loop: "{{ installed_vendor_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Refuse unsafe installed vendor source paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - >-
        not (item.stat.exists | default(false)) or
        item.stat.isreg | default(false)
    fail_msg: "Refusing unsafe vendor source path: {{ item.item.source_path }}"
    quiet: true
  loop: "{{ installed_vendor_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Preview vendor repository drift
  ansible.builtin.debug:
    msg: "Would verify and repair the {{ item.name }} signing key and source"
  changed_when: true
  loop: "{{ vendor_repositories }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: vendor_index
  when:
    - ansible_check_mode
    - >-
      not (installed_vendor_keys.results[vendor_index].stat.isreg | default(false)) or
      installed_vendor_keys.results[vendor_index].stat.islnk | default(false) or
      installed_vendor_keys.results[vendor_index].stat.checksum | default('') != item.key_sha256 or
      not (installed_vendor_sources.results[vendor_index].stat.isreg | default(false)) or
      installed_vendor_sources.results[vendor_index].stat.islnk | default(false) or
      installed_vendor_source_content.results[vendor_index].content | default('') | b64decode != item.source_content

- name: Ensure the isolated APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not ansible_check_mode

- name: Verify and install vendor repositories
  block:
    - name: Create a temporary key verification directory
      ansible.builtin.tempfile:
        state: directory
        suffix: linux-setup-keys
      register: vendor_key_temp
      changed_when: false

    - name: Download pinned vendor signing keys
      ansible.builtin.get_url:
        url: "{{ item.key_url }}"
        dest: "{{ vendor_key_temp.path }}/{{ item.name }}.key"
        checksum: "sha256:{{ item.key_sha256 }}"
        mode: "0600"
        force: true
      loop: "{{ vendor_repositories }}"
      loop_control:
        label: "{{ item.name }}"
      register: vendor_key_downloads
      changed_when: false

    - name: Read every primary signing-key fingerprint
      ansible.builtin.shell: >-
        set -o pipefail;
        gpg --batch --quiet --show-keys --with-colons {{ item.dest | quote }} |
        awk -F: '$1 == "pub" { primary = 1; next }
        primary && $1 == "fpr" { print toupper($10); primary = 0 }'
      args:
        executable: /bin/bash
      loop: "{{ vendor_key_downloads.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: vendor_key_fingerprints
      changed_when: false

    - name: Reject undocumented vendor signing keys
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length > 0
          - item.stdout_lines | difference(item.item.item.fingerprints) | length == 0
        fail_msg: "{{ item.item.item.name }} returned an undocumented primary signing key"
        quiet: true
      loop: "{{ vendor_key_fingerprints.results }}"
      loop_control:
        label: "{{ item.item.item.name }}"

    - name: Install verified vendor signing keys
      ansible.builtin.copy:
        src: "{{ item.dest }}"
        dest: "{{ item.item.key_path }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      loop: "{{ vendor_key_downloads.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Install isolated deb822 vendor sources
      ansible.builtin.copy:
        dest: "{{ item.source_path }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.source_content }}"
      become: true
      loop: "{{ vendor_repositories }}"
      loop_control:
        label: "{{ item.name }}"
  always:
    - name: Remove temporary vendor keys
      ansible.builtin.file:
        path: "{{ vendor_key_temp.path }}"
        state: absent
      when: vendor_key_temp.path is defined
      changed_when: false
  when: not ansible_check_mode

- name: Remove Anthropic's exact duplicate Claude source
  ansible.builtin.file:
    path: "{{ claude_official_source_path }}"
    state: absent
  become: true
  when:
    - not ansible_check_mode
    - claude_official_source.stat.isreg | default(false)

- name: Remove only verified Claude entries from additional APT list files
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "^{{ item.1 | regex_escape }}$"
    state: absent
  become: true
  loop: "{{ claude_additional_source_paths | product(claude_official_source_lines) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: not ansible_check_mode
