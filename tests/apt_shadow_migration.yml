---
- name: Exercise APT shadow migration
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    test_dir: "{{ lookup('ansible.builtin.env', 'APT_SHADOW_TEST_DIR') }}"
    test_policy: "{{ lookup('ansible.builtin.env', 'APT_SHADOW_TEST_POLICY') }}"
    test_source: "{{ test_dir }}/demo-tool"
    test_backup: "{{ test_source }}.pre-linux-setup-apt-{{ ansible_facts.date_time.iso8601_basic_short }}"
    test_legacy_backup: "{{ test_source }}.pre-linux-setup-apt-old"
    apt_user_local_bin: "{{ test_dir }}"
    apt_tool_commands:
      - { command: demo-tool }
    apt_shadow:
      item:
        - { command: demo-tool }
        - { path: "{{ test_dir }}", privileged: false, migration: "{{ test_policy }}" }
  tasks:
    - name: Require a narrow temporary test directory and known policy
      ansible.builtin.assert:
        that:
          - test_dir.startswith('/var/') or test_dir.startswith('/tmp/') or test_dir.startswith('/private/var/')
          - test_dir | length > 10
          - test_policy in ['remove', 'backup']
        quiet: true

    - name: Run the production legacy cleanup task
      ansible.builtin.include_tasks: ../tasks/cleanup_legacy_apt_backups.yml
      when: test_policy == 'remove'

    - name: Run the production migration task
      ansible.builtin.include_tasks: ../tasks/migrate_apt_shadow.yml

    - name: Inspect the source after migration
      ansible.builtin.stat:
        path: "{{ test_source }}"
        follow: false
      register: tested_shadow_source

    - name: Inspect the optional recoverable backup
      ansible.builtin.stat:
        path: "{{ test_backup }}"
        follow: false
      register: tested_shadow_backup

    - name: Inspect the obsolete user-local backup
      ansible.builtin.stat:
        path: "{{ test_legacy_backup }}"
        follow: false
      register: tested_legacy_backup

    - name: Require the selected migration policy
      ansible.builtin.assert:
        that:
          - tested_shadow_source.stat.exists == ansible_check_mode
          - >-
            tested_shadow_backup.stat.exists ==
            ((not ansible_check_mode) and test_policy == 'backup')
          - >-
            test_policy == 'backup' or
            tested_legacy_backup.stat.exists == ansible_check_mode
        quiet: true
