---
- name: Exercise the standalone boot-branding task
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_become_exe: /usr/bin/sudo.ws
    boot_branding_mode: "{{ requested_boot_branding_mode | default('apply') }}"
    boot_branding_logo_source: "{{ playbook_dir }}/../assets/boot-branding/mrdemonwolf-logo.png"

  tasks:
    - name: Include the standalone boot-branding task
      ansible.builtin.include_tasks: ../tasks/boot_branding.yml
      tags: boot
