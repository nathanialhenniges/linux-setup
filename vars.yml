gnome_settings:
  - schema: org.gnome.desktop.interface
    key: color-scheme
    value: "'prefer-dark'"
  - schema: org.gnome.desktop.interface
    key: show-battery-percentage
    value: "true"
  - schema: org.gnome.desktop.interface
    key: enable-hot-corners
    value: "false"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: dock-position
    value: "'BOTTOM'"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: extend-height
    value: "false"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: dock-fixed
    value: "true"
  - schema: org.gnome.shell.extensions.dash-to-dock
    key: dash-max-icon-size
    value: "32"

