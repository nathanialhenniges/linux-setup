---
- name: Configure Nathanial's Ubuntu desktop workstation
  hosts: workstation
  connection: local
  gather_facts: true
  gather_subset: >-
    {{
      ['!all', '!min', 'architecture', 'distribution', 'env', 'hardware', 'user']
      if setup_action | default('') == 'sources'
      else ['all']
    }}
  vars_files:
    - vars.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    workstation_user: "{{ ansible_facts.user_id }}"
    workstation_home: "{{ ansible_facts.env.HOME }}"
    dotfiles_dir: "{{ ansible_facts.env.HOME }}/.local/share/dotfiles"
    oh_my_posh_path: "{{ ansible_facts.env.HOME }}/.local/bin/oh-my-posh"
    font_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCove"
    font_marker: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCove/.nerd-font-{{ nerd_font.version }}"

  pre_tasks:
    - name: Require one explicit workstation action
      ansible.builtin.assert:
        that:
          - setup_action is defined
          - setup_action in supported_actions
        fail_msg: "Pass exactly one setup_action: {{ supported_actions | join(', ') }}"
        quiet: true
      tags: always

    - name: Refuse the wrong host before any mutation
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.user_uid | int != 0
          - workstation_home.startswith('/')
          - workstation_home != '/'
          - workstation_home == ansible_facts.user_dir
        fail_msg: "Supported target is Ubuntu Desktop 26.04 AMD64 run by its non-root desktop user."
        quiet: true
      tags: always

    - name: Inspect the home and Ubuntu desktop markers
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ workstation_home }}"
        - /usr/share/wayland-sessions/ubuntu.desktop
        - /usr/share/xsessions/ubuntu.desktop
      register: target_markers
      tags: always

    - name: Require a real home and Ubuntu desktop installation
      ansible.builtin.assert:
        that:
          - target_markers.results[0].stat.isdir | default(false)
          - not (target_markers.results[0].stat.islnk | default(false))
          - >-
            ansible_facts.env.XDG_CURRENT_DESKTOP | default('') | length > 0 or
            target_markers.results[1].stat.exists | default(false) or
            target_markers.results[2].stat.exists | default(false)
        fail_msg: "Ubuntu Desktop and a non-symlink home directory are required."
        quiet: true
      tags: always

    - name: Warn when memory is below the comfortable target
      ansible.builtin.debug:
        msg: "Warning: {{ ansible_facts.memtotal_mb }} MB RAM is below the comfortable 6144 MB target."
      when: ansible_facts.memtotal_mb | default(0) | int < 6144
      tags: always

    - name: Read installed package state without using the network
      ansible.builtin.package_facts:
        manager: apt
      when: setup_action != 'sources'
      tags: always

  tasks:
    - name: Calculate missing base packages
      ansible.builtin.set_fact:
        missing_base_packages: "{{ base_packages | difference(ansible_facts.packages.keys() | list) }}"
      when: setup_action == 'base'
      tags: base

    - name: Preview missing base packages
      ansible.builtin.debug:
        msg: "Would install: {{ missing_base_packages | join(', ') }}"
      changed_when: true
      when:
        - setup_action == 'base'
        - ansible_check_mode
        - missing_base_packages | length > 0
      tags: base

    - name: Install base workstation packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        fail_on_autoremove: true
        allow_unauthenticated: false
      become: true
      when:
        - setup_action == 'base'
        - not ansible_check_mode
      tags: base

    - name: Inspect user-local prompt paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ workstation_home }}/.local"
        - "{{ workstation_home }}/.local/bin"
        - "{{ oh_my_posh_path }}"
        - "{{ workstation_home }}/.local/share"
        - "{{ workstation_home }}/.local/share/fonts"
        - "{{ font_dir }}"
      register: prompt_paths
      when: setup_action == 'base'
      tags: base

    - name: Refuse symbolic links in managed prompt paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: "Refusing symbolic link in managed prompt path: {{ item.item }}"
        quiet: true
      loop: "{{ prompt_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: setup_action == 'base'
      tags: base

    - name: Require safe prompt path types
      ansible.builtin.assert:
        that:
          - >-
            not (prompt_paths.results[0].stat.exists | default(false)) or
            prompt_paths.results[0].stat.isdir | default(false)
          - >-
            not (prompt_paths.results[1].stat.exists | default(false)) or
            prompt_paths.results[1].stat.isdir | default(false)
          - >-
            not (prompt_paths.results[2].stat.exists | default(false)) or
            prompt_paths.results[2].stat.isreg | default(false)
          - >-
            not (prompt_paths.results[3].stat.exists | default(false)) or
            prompt_paths.results[3].stat.isdir | default(false)
          - >-
            not (prompt_paths.results[4].stat.exists | default(false)) or
            prompt_paths.results[4].stat.isdir | default(false)
          - >-
            not (prompt_paths.results[5].stat.exists | default(false)) or
            prompt_paths.results[5].stat.isdir | default(false)
        fail_msg: "A managed prompt path has an unsafe file type."
        quiet: true
      when: setup_action == 'base'
      tags: base

    - name: Ensure user-local prompt directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ workstation_home }}/.local/bin"
        - "{{ workstation_home }}/.local/share/fonts"
        - "{{ workstation_home }}/.cache/linux-setup"
      when: setup_action == 'base'
      tags: base

    - name: Record whether Oh My Posh is current
      ansible.builtin.set_fact:
        oh_my_posh_current: >-
          {{ prompt_paths.results[2].stat.isreg | default(false) and
             prompt_paths.results[2].stat.checksum | default('') == oh_my_posh.sha256 }}
      when: setup_action == 'base'
      tags: base

    - name: Preview the pinned Oh My Posh install
      ansible.builtin.debug:
        msg: "Would install verified Oh My Posh {{ oh_my_posh.version }} in {{ oh_my_posh_path }}"
      changed_when: true
      when:
        - setup_action == 'base'
        - ansible_check_mode
        - not oh_my_posh_current
      tags: base

    - name: Install pinned Oh My Posh
      ansible.builtin.get_url:
        url: "{{ oh_my_posh.url }}"
        dest: "{{ oh_my_posh_path }}"
        checksum: "sha256:{{ oh_my_posh.sha256 }}"
        mode: "0755"
        force: false
      when:
        - setup_action == 'base'
        - not ansible_check_mode
      tags: base

    - name: Verify the installed Oh My Posh version
      ansible.builtin.command:
        argv:
          - "{{ oh_my_posh_path }}"
          - version
      register: oh_my_posh_version
      changed_when: false
      when:
        - setup_action == 'base'
        - not ansible_check_mode
      tags: base

    - name: Require the reviewed Oh My Posh version
      ansible.builtin.assert:
        that:
          - oh_my_posh_version.stdout == oh_my_posh.version
        fail_msg: "Installed Oh My Posh did not report {{ oh_my_posh.version }}"
        quiet: true
      when:
        - setup_action == 'base'
        - not ansible_check_mode
      tags: base

    - name: Inspect the four Nerd Font files and version marker
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ (nerd_font.files | map('regex_replace', '^', font_dir ~ '/') | list) + [font_marker] }}"
      register: nerd_font_paths
      when: setup_action == 'base'
      tags: base

    - name: Refuse symbolic links in managed Nerd Font files
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: "Refusing symbolic-link Nerd Font target: {{ item.item }}"
        quiet: true
      loop: "{{ nerd_font_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: setup_action == 'base'
      tags: base

    - name: Require regular Nerd Font targets
      ansible.builtin.assert:
        that:
          - >-
            not (item.stat.exists | default(false)) or
            item.stat.isreg | default(false)
        fail_msg: "Refusing non-file Nerd Font target: {{ item.item }}"
        quiet: true
      loop: "{{ nerd_font_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: setup_action == 'base'
      tags: base

    - name: Read the installed Nerd Font release marker
      ansible.builtin.slurp:
        src: "{{ font_marker }}"
      register: nerd_font_marker_content
      failed_when: false
      changed_when: false
      when:
        - setup_action == 'base'
        - nerd_font_paths.results[4].stat.isreg | default(false)
      tags: base

    - name: Record whether the Nerd Font is current
      ansible.builtin.set_fact:
        nerd_font_current: >-
          {{ nerd_font_paths.results[0].stat.isreg | default(false) and
             nerd_font_paths.results[1].stat.isreg | default(false) and
             nerd_font_paths.results[2].stat.isreg | default(false) and
             nerd_font_paths.results[3].stat.isreg | default(false) and
             nerd_font_paths.results[4].stat.isreg | default(false) and
             nerd_font_marker_content.content | default('') | b64decode | trim == nerd_font.version }}
      when: setup_action == 'base'
      tags: base

    - name: Preview the pinned Nerd Font install
      ansible.builtin.debug:
        msg: "Would install four verified CaskaydiaCove Nerd Font styles"
      changed_when: true
      when:
        - setup_action == 'base'
        - ansible_check_mode
        - not nerd_font_current
      tags: base

    - name: Download the pinned Nerd Font archive
      ansible.builtin.get_url:
        url: "{{ nerd_font.url }}"
        dest: "{{ workstation_home }}/.cache/linux-setup/CascadiaCode-{{ nerd_font.version }}.tar.xz"
        checksum: "sha256:{{ nerd_font.sha256 }}"
        mode: "0644"
        force: false
      when:
        - setup_action == 'base'
        - not ansible_check_mode
        - not nerd_font_current
      tags: base

    - name: Ensure the Nerd Font destination exists
      ansible.builtin.file:
        path: "{{ font_dir }}"
        state: directory
        mode: "0755"
      when:
        - setup_action == 'base'
        - not ansible_check_mode
      tags: base

    - name: Install the four CaskaydiaCove Nerd Font styles
      ansible.builtin.unarchive:
        src: "{{ workstation_home }}/.cache/linux-setup/CascadiaCode-{{ nerd_font.version }}.tar.xz"
        dest: "{{ font_dir }}"
        remote_src: true
        include: "{{ nerd_font.files }}"
      register: nerd_font_extract
      when:
        - setup_action == 'base'
        - not ansible_check_mode
        - not nerd_font_current
      tags: base

    - name: Record the installed Nerd Font release
      ansible.builtin.copy:
        dest: "{{ font_marker }}"
        content: "{{ nerd_font.version }}\n"
        mode: "0644"
      when:
        - setup_action == 'base'
        - not ansible_check_mode
        - not nerd_font_current
      tags: base

    - name: Refresh the user font cache only after a font change
      ansible.builtin.command:
        argv:
          - fc-cache
          - -f
          - "{{ font_dir }}"
      changed_when: true
      when:
        - setup_action == 'base'
        - nerd_font_extract is changed
      tags: base

    - name: Inspect official ChatGPT package repository paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ chatgpt.key_path }}"
        - "{{ chatgpt.source_path }}"
        - "{{ chatgpt.defaults_path }}"
      register: chatgpt_repository_paths
      when: setup_action == 'apps'
      tags: apps

    - name: Refuse unsafe official ChatGPT package repository paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not (item.stat.exists | default(false)) or item.stat.isreg | default(false)
        fail_msg: "Refusing unsafe ChatGPT package path: {{ item.item }}"
        quiet: true
      loop: "{{ chatgpt_repository_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: setup_action == 'apps'
      tags: apps

    - name: Refuse unknown ChatGPT package defaults
      ansible.builtin.assert:
        that:
          - >-
            not (chatgpt_repository_paths.results[2].stat.exists | default(false)) or
            chatgpt_repository_paths.results[2].stat.checksum | default('') in chatgpt.allowed_defaults_sha256
        fail_msg: "Refusing unknown content in {{ chatgpt.defaults_path }}; leave it untouched and report its SHA-256."
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Record official ChatGPT package readiness
      ansible.builtin.set_fact:
        chatgpt_bootstrap_needed: >-
          {{ 'chatgpt' not in ansible_facts.packages or
             chatgpt_repository_paths.results[0].stat.checksum | default('') != chatgpt.key_sha256 or
             chatgpt_repository_paths.results[1].stat.checksum | default('') != chatgpt.source_sha256 or
             chatgpt_repository_paths.results[2].stat.checksum | default('') != chatgpt.defaults_sha256 }}
      when: setup_action == 'apps'
      tags: apps

    - name: Preview the pinned official ChatGPT package
      ansible.builtin.debug:
        msg: "Would install verified official ChatGPT {{ chatgpt.version }} for Ubuntu AMD64"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - chatgpt_bootstrap_needed
      tags: apps

    - name: Bootstrap the official ChatGPT package and signed repository
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - chatgpt_bootstrap_needed
      tags: apps
      block:
        - name: Create a temporary ChatGPT package path
          ansible.builtin.tempfile:
            state: file
            prefix: linux-setup-chatgpt-
            suffix: .deb
          register: chatgpt_package

        - name: Download the pinned official ChatGPT package
          ansible.builtin.get_url:
            url: "{{ chatgpt.url }}"
            dest: "{{ chatgpt_package.path }}"
            checksum: "sha256:{{ chatgpt.sha256 }}"
            mode: "0600"
            force: true

        - name: Install the pinned official ChatGPT package
          ansible.builtin.apt:
            deb: "{{ chatgpt_package.path }}"
            state: present
            fail_on_autoremove: true
            allow_unauthenticated: false
            lock_timeout: 300
          become: true
      always:
        - name: Remove the temporary ChatGPT package
          ansible.builtin.file:
            path: "{{ chatgpt_package.path | default('/tmp/linux-setup-chatgpt-not-created') }}"
            state: absent
          when: chatgpt_package is defined and chatgpt_package.path is defined

    - name: Verify the installed official ChatGPT package repository
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ chatgpt.key_path }}"
        - "{{ chatgpt.source_path }}"
        - "{{ chatgpt.defaults_path }}"
      register: installed_chatgpt_repository_paths
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Require the exact official ChatGPT package repository
      ansible.builtin.assert:
        that:
          - installed_chatgpt_repository_paths.results[0].stat.isreg | default(false)
          - not (installed_chatgpt_repository_paths.results[0].stat.islnk | default(false))
          - installed_chatgpt_repository_paths.results[0].stat.checksum | default('') == chatgpt.key_sha256
          - installed_chatgpt_repository_paths.results[1].stat.isreg | default(false)
          - not (installed_chatgpt_repository_paths.results[1].stat.islnk | default(false))
          - installed_chatgpt_repository_paths.results[1].stat.checksum | default('') == chatgpt.source_sha256
          - installed_chatgpt_repository_paths.results[2].stat.isreg | default(false)
          - not (installed_chatgpt_repository_paths.results[2].stat.islnk | default(false))
          - installed_chatgpt_repository_paths.results[2].stat.checksum | default('') == chatgpt.defaults_sha256
        fail_msg: "Official ChatGPT package repository does not match the reviewed package; stop before APT refresh."
        quiet: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Configure verified core vendor repositories
      ansible.builtin.include_tasks:
        file: tasks/vendor_repositories.yml
        apply:
          tags:
            - sources
            - apps
      vars:
        vendor_repositories: "{{ core_vendor_repositories }}"
      when: setup_action in ['sources', 'apps']
      tags:
        - sources
        - apps

    - name: Install the selected command-line tools
      ansible.builtin.include_tasks:
        file: tasks/cli_tools.yml
        apply:
          tags: tools
      when: setup_action == 'tools'
      tags: tools

    - name: Calculate missing core apps
      ansible.builtin.set_fact:
        missing_core_apps: "{{ core_app_packages | difference(ansible_facts.packages.keys() | list) }}"
      when: setup_action == 'apps'
      tags: apps

    - name: Preview missing core apps
      ansible.builtin.debug:
        msg: "Would verify vendor keys and install: {{ missing_core_apps | join(', ') }}"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - missing_core_apps | length > 0
      tags: apps

    - name: Refresh APT metadata for approved applications
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300
        update_cache_retries: 5
        update_cache_retry_max_delay: 12
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Install each approved APT application
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: false
        fail_on_autoremove: true
        allow_unauthenticated: false
        lock_timeout: 300
      become: true
      loop: "{{ core_app_packages }}"
      loop_control:
        label: "{{ item }}"
      register: approved_app_install
      retries: 3
      delay: 5
      until: approved_app_install is succeeded
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Inspect Claude's package-managed repository after application installation
      ansible.builtin.stat:
        path: "{{ claude_official_source_path }}"
        follow: false
      register: post_install_claude_source
      when: setup_action == 'apps'
      tags: apps

    - name: Require Claude package installation to honor the repository opt-out
      ansible.builtin.assert:
        that:
          - not (post_install_claude_source.stat.exists | default(false))
        fail_msg: >-
          Claude recreated {{ claude_official_source_path }} and would break APT.
          The package repository opt-out was not honored; stop before another APT action.
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Inspect the Snap executable
      ansible.builtin.stat:
        path: /usr/bin/snap
        follow: false
      register: core_snap_executable
      when: setup_action == 'apps'
      tags: apps

    - name: Require Ubuntu's packaged Snap client
      ansible.builtin.assert:
        that:
          - core_snap_executable.stat.isreg | default(false)
          - not (core_snap_executable.stat.islnk | default(false))
          - core_snap_executable.stat.executable | default(false)
        fail_msg: "Ubuntu's packaged Snap client is required. Run ./setup.sh base, then retry apps."
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Read installed approved Snap applications
      ansible.builtin.command:
        argv:
          - /usr/bin/snap
          - list
          - "{{ item }}"
      loop: "{{ core_snap_packages }}"
      register: installed_core_snaps
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Preview missing approved Snap applications
      ansible.builtin.debug:
        msg: "Would install the publisher-supported Snap: {{ item.item }}"
      loop: "{{ installed_core_snaps.results }}"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - item.rc | default(1) != 0
      tags: apps

    - name: Install missing approved Snap applications
      ansible.builtin.command:
        argv:
          - /usr/bin/snap
          - install
          - "{{ item.item }}"
      loop: "{{ installed_core_snaps.results }}"
      changed_when: true
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - item.rc | default(1) != 0
      tags: apps

    - name: Inspect the Flatpak executable
      ansible.builtin.stat:
        path: /usr/bin/flatpak
        follow: false
      register: core_flatpak_executable
      when: setup_action == 'apps'
      tags: apps

    - name: Require Ubuntu's packaged Flatpak client
      ansible.builtin.assert:
        that:
          - core_flatpak_executable.stat.isreg | default(false)
          - not (core_flatpak_executable.stat.islnk | default(false))
          - core_flatpak_executable.stat.executable | default(false)
        fail_msg: "Ubuntu's packaged Flatpak client is required. Run ./setup.sh base, then retry apps."
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Read configured Flatpak remotes
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - remotes
          - --system
          - --columns=name,url
      register: configured_flatpak_remotes
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Record the reviewed Flathub remote state
      ansible.builtin.set_fact:
        core_flatpak_remote_urls: >-
          {{ (configured_flatpak_remotes.stdout_lines | default([])) |
             map('regex_search', '^' ~ core_flatpak_remote.name ~ '\s+(\S+)', '\1') |
             reject('none') | map('first') | list }}
      when: setup_action == 'apps'
      tags: apps

    - name: Record whether the reviewed Flathub remote is configured
      ansible.builtin.set_fact:
        core_flatpak_remote_ready: >-
          {{ core_flatpak_remote_urls | length == 1 and
             core_flatpak_remote_urls[0] | regex_replace('/$', '') ==
             core_flatpak_remote.repo_url | regex_replace('/$', '') }}
      when: setup_action == 'apps'
      tags: apps

    - name: Refuse a Flathub remote pointing somewhere else
      ansible.builtin.assert:
        that:
          - core_flatpak_remote_ready or core_flatpak_remote_urls | length == 0
        fail_msg: "A system remote named {{ core_flatpak_remote.name }} already points at {{ core_flatpak_remote_urls | join(', ') }} rather than {{ core_flatpak_remote.repo_url }}. Review it manually before running apps."
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Preview the reviewed Flathub remote
      ansible.builtin.debug:
        msg: "Would add the reviewed system Flatpak remote {{ core_flatpak_remote.name }} ({{ core_flatpak_remote.url }})"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - not core_flatpak_remote_ready
      tags: apps

    - name: Add the reviewed Flathub remote
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - remote-add
          - --system
          - --if-not-exists
          - "{{ core_flatpak_remote.name }}"
          - "{{ core_flatpak_remote.url }}"
      changed_when: true
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - not core_flatpak_remote_ready
      tags: apps

    - name: Read installed approved Flatpak applications
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - info
          - --system
          - "{{ item }}"
      loop: "{{ core_flatpak_packages }}"
      register: installed_core_flatpaks
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Preview missing approved Flatpak applications
      ansible.builtin.debug:
        msg: "Would install the verified Flathub application: {{ item.item }}"
      loop: "{{ installed_core_flatpaks.results }}"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - item.rc | default(1) != 0
      tags: apps

    - name: Install missing approved Flatpak applications
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - install
          - --system
          - --noninteractive
          - --assumeyes
          - "{{ core_flatpak_remote.name }}"
          - "{{ item.item }}"
      loop: "{{ installed_core_flatpaks.results }}"
      changed_when: true
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - item.rc | default(1) != 0
      tags: apps

    - name: Verify every approved Flatpak application origin
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - info
          - --system
          - --show-origin
          - "{{ item }}"
      loop: "{{ core_flatpak_packages }}"
      register: approved_flatpak_origins
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Require every approved Flatpak application from Flathub
      ansible.builtin.assert:
        that:
          - approved_flatpak_origins.results | selectattr('rc', 'equalto', 0) | list | length == core_flatpak_packages | length
          - approved_flatpak_origins.results | rejectattr('stdout', 'equalto', core_flatpak_remote.name) | list | length == 0
        fail_msg: "An approved Flatpak is missing or has an unexpected origin; no application-specific cleanup was attempted."
        quiet: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Verify the reviewed Upscayl Flatpak before migration cleanup
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - info
          - --system
          - --show-origin
          - org.upscayl.Upscayl
      register: migrated_upscayl_flatpak
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Read installed Snap packages for legacy Upscayl
      ansible.builtin.command:
        argv: [/usr/bin/snap, list]
      register: legacy_upscayl_snaps
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Read installed user-scoped Flatpak application IDs
      ansible.builtin.command:
        argv: [/usr/bin/flatpak, list, --user, --app, --columns=application]
      register: legacy_upscayl_user_flatpaks
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'apps'
      tags: apps

    - name: Require readable legacy package state before migration
      ansible.builtin.assert:
        that:
          - legacy_upscayl_snaps.rc == 0
          - legacy_upscayl_user_flatpaks.rc == 0
        fail_msg: "Could not read every legacy Upscayl package route; no migration cleanup was attempted."
        quiet: true
      when: setup_action == 'apps'
      tags: apps

    - name: Record recognized legacy Upscayl package routes
      ansible.builtin.set_fact:
        legacy_upscayl_snap_present: >-
          {{ (legacy_upscayl_snaps.stdout_lines | default([]) |
              select('match', '^upscayl[ ]') | list | length) == 1 }}
        legacy_upscayl_user_flatpak_present: >-
          {{ 'org.upscayl.Upscayl' in
             (legacy_upscayl_user_flatpaks.stdout_lines | default([])) }}
      when: setup_action == 'apps'
      tags: apps

    - name: Preview legacy Upscayl package migration
      ansible.builtin.debug:
        msg: "Would remove the legacy Upscayl {{ item }} only after the reviewed system Flatpak verifies"
      loop: >-
        {{ (['Debian package'] if 'upscayl' in ansible_facts.packages else []) +
           (['Snap'] if legacy_upscayl_snap_present else []) +
           (['user Flatpak'] if legacy_upscayl_user_flatpak_present else []) }}
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
      tags: apps

    - name: Require the reviewed Upscayl Flatpak before migration cleanup
      ansible.builtin.assert:
        that:
          - migrated_upscayl_flatpak.rc == 0
          - migrated_upscayl_flatpak.stdout | trim == core_flatpak_remote.name
        fail_msg: "The reviewed Upscayl Flatpak did not verify; legacy installations were left untouched."
        quiet: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Remove the legacy Upscayl Debian package
      ansible.builtin.apt:
        name: upscayl
        state: absent
        fail_on_autoremove: true
        lock_timeout: 300
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - migrated_upscayl_flatpak.rc == 0
        - migrated_upscayl_flatpak.stdout | trim == core_flatpak_remote.name
        - "'upscayl' in ansible_facts.packages"
      tags: apps

    - name: Remove the legacy Upscayl Snap
      ansible.builtin.command:
        argv: [/usr/bin/snap, remove, upscayl]
      changed_when: true
      become: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - migrated_upscayl_flatpak.rc == 0
        - migrated_upscayl_flatpak.stdout | trim == core_flatpak_remote.name
        - legacy_upscayl_snap_present
      tags: apps

    - name: Remove the legacy user-scoped Upscayl Flatpak
      ansible.builtin.command:
        argv: [/usr/bin/flatpak, uninstall, --user, --noninteractive, --assumeyes, org.upscayl.Upscayl]
      changed_when: true
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
        - migrated_upscayl_flatpak.rc == 0
        - migrated_upscayl_flatpak.stdout | trim == core_flatpak_remote.name
        - legacy_upscayl_user_flatpak_present
      tags: apps

    - name: Inspect user-local LibrePods paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - { path: "{{ workstation_home }}/.local", kind: directory }
        - { path: "{{ workstation_home }}/.local/bin", kind: directory }
        - { path: "{{ librepods.install_path }}", kind: file }
        - { path: "{{ workstation_home }}/.local/share", kind: directory }
        - { path: "{{ workstation_home }}/.local/share/applications", kind: directory }
        - { path: "{{ librepods.launcher_path }}", kind: file }
      loop_control:
        label: "{{ item.path }}"
      register: librepods_paths
      when: setup_action == 'apps'
      tags: apps

    - name: Refuse unsafe LibrePods paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - >-
            not (item.stat.exists | default(false)) or
            (item.item.kind == 'directory' and item.stat.isdir | default(false)) or
            (item.item.kind == 'file' and item.stat.isreg | default(false))
        fail_msg: "Refusing unsafe LibrePods path: {{ item.item.path }}"
        quiet: true
      loop: "{{ librepods_paths.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: setup_action == 'apps'
      tags: apps

    - name: Record whether LibrePods is current
      ansible.builtin.set_fact:
        librepods_current: >-
          {{ librepods_paths.results[2].stat.isreg | default(false) and
             librepods_paths.results[2].stat.executable | default(false) and
             librepods_paths.results[2].stat.checksum | default('') == librepods.sha256 and
             librepods_paths.results[5].stat.isreg | default(false) and
             librepods_paths.results[5].stat.checksum | default('') == (librepods.desktop_entry | hash('sha256')) }}
      when: setup_action == 'apps'
      tags: apps

    - name: Preview the pinned LibrePods install
      ansible.builtin.debug:
        msg: "Would install verified LibrePods {{ librepods.version }} for the current user"
      changed_when: true
      when:
        - setup_action == 'apps'
        - ansible_check_mode
        - not librepods_current
      tags: apps

    - name: Ensure user-local LibrePods directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ workstation_home }}/.local/bin"
        - "{{ workstation_home }}/.local/share/applications"
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Install the pinned LibrePods AppImage
      ansible.builtin.get_url:
        url: "{{ librepods.url }}"
        dest: "{{ librepods.install_path }}"
        checksum: "sha256:{{ librepods.sha256 }}"
        mode: "0755"
        force: false
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Install the LibrePods desktop launcher
      ansible.builtin.copy:
        dest: "{{ librepods.launcher_path }}"
        content: "{{ librepods.desktop_entry }}"
        mode: "0644"
      when:
        - setup_action == 'apps'
        - not ansible_check_mode
      tags: apps

    - name: Show application launch and manual steps
      ansible.builtin.debug:
        msg:
          - "ChatGPT launch command: chatgpt. Sign-in stays manual; Linux uses XWayland by default while native Wayland support matures."
          - "Extension Manager launch command: extension-manager"
          - "LibrePods launch command: librepods. Pair AirPods in GNOME Bluetooth first; autostart and Apple VendorID spoofing stay off."
          - "Telegram launch command: flatpak run org.telegram.desktop. Sign-in stays manual; leave launch at login disabled."
          - "Upscayl launch test: run vulkaninfo --summary, then flatpak run org.upscayl.Upscayl and upscale one small image. Intel HD 6000 support is not guaranteed."
          - "Plex launch command: flatpak run tv.plex.PlexDesktop. Test local discovery with WARP; keep Plex, OBS, and Upscayl from running together."
          - "Cider launch command: flatpak run sh.cider.Cider. License activation and Apple sign-in stay manual; autostart stays off."
          - "Discord stays manual: download its official .deb from https://discord.com/download and open it with App Center."
          - "LocalWP and Raspberry Pi Imager stay on-demand; Chrome PWAs and replacement workflows stay manual."
          - "Account sign-ins and Cloudflare enrollment remain manual."
      when: setup_action == 'apps'
      tags: apps

    - name: Keep the Ghostty launch test manual
      ansible.builtin.debug:
        msg: "Launch-test Ghostty on Intel HD 6000 before running the terminal action."
      when: setup_action == 'apps'
      tags: apps

    - name: Inspect Ghostty and the default-terminal paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /usr/share/applications/com.mitchellh.ghostty.desktop
        - "{{ workstation_home }}/.config"
        - "{{ workstation_home }}/.config/ubuntu-xdg-terminals.list"
      register: terminal_paths
      when: setup_action == 'terminal'
      tags: terminal

    - name: Require the launch-tested Ghostty package and safe paths
      ansible.builtin.assert:
        that:
          - terminal_paths.results[0].stat.isreg | default(false)
          - not (terminal_paths.results[1].stat.islnk | default(false))
          - >-
            not (terminal_paths.results[1].stat.exists | default(false)) or
            terminal_paths.results[1].stat.isdir | default(false)
          - not (terminal_paths.results[2].stat.islnk | default(false))
          - >-
            not (terminal_paths.results[2].stat.exists | default(false)) or
            terminal_paths.results[2].stat.isreg | default(false)
        fail_msg: "Ghostty must be installed and the default-terminal path must not contain symlinks."
        quiet: true
      when: setup_action == 'terminal'
      tags: terminal

    - name: Ensure the user config directory exists
      ansible.builtin.file:
        path: "{{ workstation_home }}/.config"
        state: directory
        mode: "0755"
      when: setup_action == 'terminal'
      tags: terminal

    - name: Make Ghostty the Ubuntu default terminal
      ansible.builtin.copy:
        dest: "{{ workstation_home }}/.config/ubuntu-xdg-terminals.list"
        content: |
          com.mitchellh.ghostty.desktop
        mode: "0644"
        backup: true
      when:
        - setup_action == 'terminal'
        - >-
          not ansible_check_mode or
          terminal_paths.results[1].stat.isdir | default(false)
      tags: terminal

    - name: Inspect managed dotfiles checkout paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ workstation_home }}/.local"
        - "{{ workstation_home }}/.local/share"
        - "{{ dotfiles_dir }}"
        - "{{ dotfiles_dir }}/.git"
      register: dotfiles_paths
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Refuse unsafe dotfiles checkout paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
        fail_msg: "Refusing symbolic link in managed dotfiles checkout: {{ item.item }}"
        quiet: true
      loop: "{{ dotfiles_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Require an existing dotfiles path to be a Git checkout
      ansible.builtin.assert:
        that:
          - >-
            not (dotfiles_paths.results[2].stat.exists | default(false)) or
            dotfiles_paths.results[3].stat.isdir | default(false)
        fail_msg: "The managed dotfiles path exists but is not a Git repository."
        quiet: true
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Ensure the managed dotfiles parent exists
      ansible.builtin.file:
        path: "{{ workstation_home }}/.local/share"
        state: directory
        mode: "0755"
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
      tags: dotfiles

    - name: Read the existing dotfiles origin
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", remote, get-url, origin]
      register: dotfiles_origin_before
      changed_when: false
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Read the existing dotfiles branch
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", symbolic-ref, --quiet, --short, HEAD]
      register: dotfiles_branch_before
      changed_when: false
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Read existing dotfiles changes
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", status, --porcelain]
      register: dotfiles_status_before
      changed_when: false
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Refuse the wrong, detached, or dirty dotfiles checkout
      ansible.builtin.assert:
        that:
          - dotfiles_origin_before.stdout in dotfiles_allowed_origins
          - dotfiles_branch_before.stdout == 'main'
          - dotfiles_status_before.stdout == ''
        fail_msg: "Existing dotfiles must have the expected origin, main branch, and a clean worktree."
        quiet: true
      when:
        - setup_action == 'dotfiles'
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Preview a missing dotfiles checkout
      ansible.builtin.debug:
        msg: "Would clone the reviewed dotfiles main branch into {{ dotfiles_dir }}"
      changed_when: true
      when:
        - setup_action == 'dotfiles'
        - ansible_check_mode
        - not (dotfiles_paths.results[2].stat.exists | default(false))
      tags: dotfiles

    - name: Clone the reviewed dotfiles checkout when missing
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles_dir }}"
        version: main
        update: false
        force: false
        recursive: false
        single_branch: true
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
        - not (dotfiles_paths.results[2].stat.exists | default(false))
      tags: dotfiles

    - name: Fetch the reviewed dotfiles main branch
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", fetch, origin, main]
      changed_when: false
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Fast-forward the reviewed dotfiles main branch only
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", merge, --ff-only, origin/main]
      register: dotfiles_fast_forward
      changed_when: "'Already up to date.' not in dotfiles_fast_forward.stdout"
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Read the applied dotfiles HEAD and origin/main
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", rev-parse, HEAD, origin/main]
      register: dotfiles_revisions
      changed_when: false
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode or (dotfiles_paths.results[3].stat.isdir | default(false))
      tags: dotfiles

    - name: Require dotfiles HEAD to exactly match origin/main
      ansible.builtin.assert:
        that:
          - dotfiles_revisions.stdout_lines | length == 2
          - dotfiles_revisions.stdout_lines[0] == dotfiles_revisions.stdout_lines[1]
        fail_msg: "Dotfiles HEAD does not exactly match the verified local origin/main."
        quiet: true
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode or (dotfiles_paths.results[3].stat.isdir | default(false))
      tags: dotfiles

    - name: Inspect the dedicated Ubuntu desktop dotfiles entry point
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/linux-desktop.sh"
        follow: false
      register: dotfiles_desktop_entry
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode or (dotfiles_paths.results[3].stat.isdir | default(false))
      tags: dotfiles

    - name: Require the dedicated regular-file desktop entry point
      ansible.builtin.assert:
        that:
          - dotfiles_desktop_entry.stat.isreg | default(false)
          - not (dotfiles_desktop_entry.stat.islnk | default(false))
        fail_msg: "Dedicated dotfiles/linux-desktop.sh is missing or unsafe."
        quiet: true
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode or (dotfiles_paths.results[3].stat.isdir | default(false))
      tags: dotfiles

    - name: Preview the isolated Linux desktop dotfiles
      ansible.builtin.command:
        argv: [bash, "{{ dotfiles_dir }}/linux-desktop.sh", --dry-run]
      register: dotfiles_preview
      changed_when: "'would apply ' in dotfiles_preview.stdout"
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - ansible_check_mode
        - dotfiles_paths.results[3].stat.isdir | default(false)
      tags: dotfiles

    - name: Apply only the isolated Linux desktop dotfiles
      ansible.builtin.command:
        argv: [bash, "{{ dotfiles_dir }}/linux-desktop.sh"]
      register: dotfiles_apply
      changed_when: "'Applied ' in dotfiles_apply.stdout"
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
      tags: dotfiles

    - name: Inspect packaged Zsh
      ansible.builtin.stat:
        path: /usr/bin/zsh
        follow: false
      register: packaged_zsh
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Require an executable packaged Zsh
      ansible.builtin.assert:
        that:
          - packaged_zsh.stat.isreg | default(false)
          - not (packaged_zsh.stat.islnk | default(false))
          - packaged_zsh.stat.executable | default(false)
        fail_msg: "Run the base action first: /usr/bin/zsh is missing or unsafe."
        quiet: true
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Verify packaged Zsh is an approved login shell
      ansible.builtin.command:
        argv: [grep, -Fx, /usr/bin/zsh, /etc/shells]
      changed_when: false
      check_mode: false
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
      tags: dotfiles

    - name: Read the current account login shell
      ansible.builtin.getent:
        database: passwd
        key: "{{ workstation_user }}"
      when: setup_action == 'dotfiles'
      tags: dotfiles

    - name: Preview the current-user Zsh login-shell change
      ansible.builtin.debug:
        msg: "Would set only {{ workstation_user }}'s login shell to /usr/bin/zsh"
      changed_when: true
      when:
        - setup_action == 'dotfiles'
        - ansible_check_mode
        - ansible_facts.getent_passwd[workstation_user][-1] not in ['/bin/zsh', '/usr/bin/zsh']
      tags: dotfiles

    - name: Make packaged Zsh the current desktop user's login shell
      ansible.builtin.user:
        name: "{{ workstation_user }}"
        shell: /usr/bin/zsh
      become: true
      when:
        - setup_action == 'dotfiles'
        - not ansible_check_mode
        - ansible_facts.getent_passwd[workstation_user][-1] not in ['/bin/zsh', '/usr/bin/zsh']
      tags: dotfiles

    - name: Apply or roll back the reviewed Plymouth boot branding
      ansible.builtin.include_tasks:
        file: tasks/boot_branding.yml
        apply:
          tags: boot
      when: setup_action == 'boot'
      tags: boot

    - name: Require a live Ubuntu desktop session for GNOME settings
      ansible.builtin.assert:
        that:
          - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS | default('') | length > 0
          - ansible_facts.env.XDG_RUNTIME_DIR | default('') | length > 0
          - >-
            ansible_facts.env.WAYLAND_DISPLAY | default('') | length > 0 or
            ansible_facts.env.DISPLAY | default('') | length > 0
        fail_msg: "Run the gnome action from a terminal inside the logged-in Ubuntu desktop session."
        quiet: true
      when: setup_action == 'gnome'
      tags: gnome

    - name: Install and apply reviewed personal desktop images
      ansible.builtin.include_tasks:
        file: tasks/desktop_personalization.yml
        apply:
          tags: gnome
      when: setup_action == 'gnome'
      tags: gnome

    - name: Inspect reviewed Dock launcher candidates
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: true
      loop: "{{ gnome_dock_favorite_candidates }}"
      loop_control:
        label: "{{ item.desktop_id }}"
      register: gnome_dock_candidate_launchers
      when: setup_action == 'gnome'
      tags: gnome

    - name: Record installed reviewed Dock launchers
      ansible.builtin.set_fact:
        installed_gnome_dock_favorites: >-
          {{ gnome_dock_candidate_launchers.results |
             selectattr('stat.isreg', 'defined') |
             selectattr('stat.isreg') |
             map(attribute='item.desktop_id') | list | unique }}
      when: setup_action == 'gnome'
      tags: gnome

    - name: Read current GNOME Dock favorites
      ansible.builtin.command:
        argv: [gsettings, get, org.gnome.shell, favorite-apps]
      register: current_gnome_dock_favorites
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'gnome'
      tags: gnome

    - name: Require readable GNOME Dock favorites
      ansible.builtin.assert:
        that:
          - current_gnome_dock_favorites.rc == 0
        fail_msg: "Could not read GNOME Dock favorites; no Dock pins were changed."
        quiet: true
      when: setup_action == 'gnome'
      tags: gnome

    - name: Parse current GNOME Dock favorites
      ansible.builtin.set_fact:
        current_gnome_dock_favorite_ids: >-
          {{ current_gnome_dock_favorites.stdout |
             regex_replace('^@as ', '') | from_yaml }}
      when: setup_action == 'gnome'
      tags: gnome

    - name: Build additive GNOME Dock favorites
      ansible.builtin.set_fact:
        desired_gnome_dock_favorites: >-
          {{ (installed_gnome_dock_favorites + current_gnome_dock_favorite_ids) | unique }}
      when: setup_action == 'gnome'
      tags: gnome

    - name: Preview GNOME Dock favorite additions
      ansible.builtin.debug:
        msg: "Would pin installed reviewed apps while preserving current Dock favorites: {{ desired_gnome_dock_favorites | join(', ') }}"
      changed_when: true
      when:
        - setup_action == 'gnome'
        - ansible_check_mode
        - current_gnome_dock_favorite_ids != desired_gnome_dock_favorites
      tags: gnome

    - name: Pin installed reviewed applications to the GNOME Dock
      ansible.builtin.command:
        argv: [gsettings, set, org.gnome.shell, favorite-apps, "{{ desired_gnome_dock_favorites | string }}"]
      changed_when: true
      when:
        - setup_action == 'gnome'
        - not ansible_check_mode
        - current_gnome_dock_favorite_ids != desired_gnome_dock_favorites
      tags: gnome

    - name: Read applied GNOME Dock favorites
      ansible.builtin.command:
        argv: [gsettings, get, org.gnome.shell, favorite-apps]
      register: applied_gnome_dock_favorites
      changed_when: false
      failed_when: false
      when:
        - setup_action == 'gnome'
        - not ansible_check_mode
      tags: gnome

    - name: Require applied GNOME Dock favorites
      ansible.builtin.assert:
        that:
          - applied_gnome_dock_favorites.rc == 0
          - >-
            (applied_gnome_dock_favorites.stdout |
             regex_replace('^@as ', '') | from_yaml) == desired_gnome_dock_favorites
        fail_msg: "GNOME did not retain the requested additive Dock favorites."
        quiet: true
      when:
        - setup_action == 'gnome'
        - not ansible_check_mode
      tags: gnome

    - name: Read current GNOME values
      ansible.builtin.command:
        argv: [gsettings, get, "{{ item.schema }}", "{{ item.key }}"]
      loop: "{{ gnome_settings }}"
      loop_control:
        label: "{{ item.schema }} {{ item.key }}"
      register: current_gnome_settings
      changed_when: false
      failed_when: false
      check_mode: false
      when: setup_action == 'gnome'
      tags: gnome

    - name: Preview GNOME preference drift
      ansible.builtin.debug:
        msg: "Would set {{ item.item.schema }} {{ item.item.key }} to {{ item.item.value }}"
      loop: "{{ current_gnome_settings.results }}"
      loop_control:
        label: "{{ item.item.schema }} {{ item.item.key }}"
      changed_when: true
      when:
        - setup_action == 'gnome'
        - ansible_check_mode
        - item.rc == 0
        - item.stdout != item.item.value
      tags: gnome

    - name: Apply macOS-friendly GNOME preferences
      ansible.builtin.command:
        argv: [gsettings, set, "{{ item.item.schema }}", "{{ item.item.key }}", "{{ item.item.value }}"]
      loop: "{{ current_gnome_settings.results }}"
      loop_control:
        label: "{{ item.item.schema }} {{ item.item.key }}"
      changed_when: true
      when:
        - setup_action == 'gnome'
        - not ansible_check_mode
        - item.rc == 0
        - item.stdout != item.item.value
      tags: gnome

    - name: Explain skipped GNOME keys
      ansible.builtin.debug:
        msg: "Skipped unavailable GNOME key: {{ item.item.schema }} {{ item.item.key }}"
      loop: "{{ current_gnome_settings.results }}"
      loop_control:
        label: "{{ item.item.schema }} {{ item.item.key }}"
      when:
        - setup_action == 'gnome'
        - item.rc != 0
      tags: gnome

    - name: Keep native search and Toshy boundaries explicit
      ansible.builtin.debug:
        msg:
          - "Before Toshy, Super opens GNOME Overview search."
          - "After the guarded Toshy step, physical Command+C/V maps to copy/paste and Command+Space opens search; Option/Alt stays Option/Alt."
          - "Toshy remains a separate interactive step with its own rollback."
      when: setup_action == 'gnome'
      tags: gnome
