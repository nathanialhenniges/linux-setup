---
- name: Configure the local MacBook Air Hyprland workstation
  hosts: workstation
  connection: local
  gather_facts: true
  become: false
  vars_files:
    - vars.yml
  pre_tasks:
    - name: Require an explicit reviewed action
      ansible.builtin.assert:
        that:
          - setup_action is defined
          - setup_action in supported_actions
          - ansible_facts.user_id != 'root'
          - ansible_facts.os_family == 'Archlinux'
          - ansible_facts.pkg_mgr == 'pacman'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "Run setup.sh as a non-root user on supported Arch hardware."
        quiet: true
      tags: [always]

    - name: Read the hardware model and operating system identity
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /sys/class/dmi/id/product_name
        - /etc/os-release
      register: platform_identity
      tags: [always]

    - name: Require EndeavourOS or Arch Linux on the reviewed MacBook Air
      ansible.builtin.assert:
        that:
          - platform_identity.results[0].content | b64decode | trim == expected_product_name
          - (platform_identity.results[1].content | b64decode) is search('(?m)^ID=(arch|endeavouros)$')
        fail_msg: "This setup supports EndeavourOS or Arch Linux on MacBookAir7,2 only."
        quiet: true
      tags: [always]

    - name: Read sshd service state without changing it
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", sshd.service]
      loop: [is-active, is-enabled]
      register: sshd_state
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Require sshd to remain inactive and disabled
      ansible.builtin.assert:
        that:
          - sshd_state.results[0].stdout != 'active'
          - sshd_state.results[1].stdout not in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime']
        fail_msg: "sshd is active or enabled. Disable it manually before running setup; this repo will not change SSH service state."
        quiet: true
      tags: [always]

    - name: Inspect the workstation home directory without following links
      ansible.builtin.stat:
        path: "{{ workstation_home }}"
        follow: false
      register: workstation_home_state
      tags: [always]

    - name: Require a real user home directory
      ansible.builtin.assert:
        that:
          - workstation_home_state.stat.isdir | default(false)
          - not (workstation_home_state.stat.islnk | default(false))
        fail_msg: "Refusing a missing, linked, or unsafe workstation home directory."
        quiet: true
      tags: [always]

  tasks:
    - name: Install base packages
      ansible.builtin.import_tasks: tasks/base.yml
      when: setup_action == 'base'
      tags: [base]

    - name: Install workstation apps
      ansible.builtin.import_tasks: tasks/apps.yml
      when: setup_action == 'apps'
      tags: [apps]

    - name: Install selected tools
      ansible.builtin.import_tasks: tasks/cli_tools.yml
      when: setup_action == 'tools'
      tags: [tools]

    - name: Configure the Hyprland desktop
      ansible.builtin.import_tasks: tasks/desktop_personalization.yml
      when: setup_action == 'desktop'
      tags: [desktop]
