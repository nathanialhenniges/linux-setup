---
- name: Show and verify the Ubuntu workstation state
  hosts: workstation
  connection: local
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    strict_verify: false
    workstation_user: "{{ ansible_facts.user_id }}"
    workstation_home: "{{ ansible_facts.env.HOME }}"
    dotfiles_dir: "{{ ansible_facts.env.HOME }}/.local/share/dotfiles"
    oh_my_posh_path: "{{ ansible_facts.env.HOME }}/.local/bin/oh-my-posh"
    font_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCove"
    font_marker: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CaskaydiaCove/.nerd-font-{{ nerd_font.version }}"
    required_packages: "{{ base_packages + core_app_packages }}"

  tasks:
    - name: Refuse a non-Ubuntu-desktop target
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.user_uid | int != 0
          - workstation_home.startswith('/')
          - workstation_home != '/'
          - workstation_home == ansible_facts.user_dir
        fail_msg: "Supported target is Ubuntu Desktop 26.04 AMD64 run by its non-root desktop user."
        quiet: true

    - name: Inspect the home and Ubuntu desktop markers
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ workstation_home }}"
        - /usr/share/wayland-sessions/ubuntu.desktop
        - /usr/share/xsessions/ubuntu.desktop
      register: verification_target_markers

    - name: Require a real home and Ubuntu desktop installation
      ansible.builtin.assert:
        that:
          - verification_target_markers.results[0].stat.isdir | default(false)
          - not (verification_target_markers.results[0].stat.islnk | default(false))
          - >-
            ansible_facts.env.XDG_CURRENT_DESKTOP | default('') | length > 0 or
            verification_target_markers.results[1].stat.exists | default(false) or
            verification_target_markers.results[2].stat.exists | default(false)
        fail_msg: "Ubuntu Desktop and a non-symlink home directory are required."
        quiet: true

    - name: Read installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Calculate missing required packages
      ansible.builtin.set_fact:
        missing_required_packages: "{{ required_packages | difference(ansible_facts.packages.keys() | list) }}"
        missing_base_packages: "{{ base_packages | difference(ansible_facts.packages.keys() | list) }}"
        missing_core_app_packages: "{{ core_app_packages | difference(ansible_facts.packages.keys() | list) }}"

    - name: Inspect the Snap executable
      ansible.builtin.stat:
        path: /usr/bin/snap
        follow: false
      register: verified_snap_executable

    - name: Check whether Postman is installed from Snap
      ansible.builtin.command:
        argv:
          - /usr/bin/snap
          - list
          - postman
      register: verified_postman_snap
      changed_when: false
      failed_when: false
      when:
        - verified_snap_executable.stat.isreg | default(false)
        - verified_snap_executable.stat.executable | default(false)

    - name: Inspect the Flatpak executable
      ansible.builtin.stat:
        path: /usr/bin/flatpak
        follow: false
      register: verified_flatpak_executable

    - name: Check whether Upscayl is installed from Flathub
      ansible.builtin.command:
        argv:
          - /usr/bin/flatpak
          - info
          - --system
          - --show-origin
          - org.upscayl.Upscayl
      register: verified_upscayl_flatpak
      changed_when: false
      failed_when: false
      when:
        - verified_flatpak_executable.stat.isreg | default(false)
        - verified_flatpak_executable.stat.executable | default(false)

    - name: Read installed Snap packages for legacy Upscayl verification
      ansible.builtin.command:
        argv: [/usr/bin/snap, list]
      register: verified_legacy_upscayl_snaps
      changed_when: false
      failed_when: false

    - name: Read user-scoped Flatpak application IDs for legacy Upscayl verification
      ansible.builtin.command:
        argv: [/usr/bin/flatpak, list, --user, --app, --columns=application]
      register: verified_legacy_upscayl_user_flatpaks
      changed_when: false
      failed_when: false
      when:
        - verified_flatpak_executable.stat.isreg | default(false)
        - verified_flatpak_executable.stat.executable | default(false)

    - name: Calculate missing selected CLI packages
      ansible.builtin.set_fact:
        missing_selected_tool_packages: "{{ tool_packages | difference(ansible_facts.packages.keys() | list) }}"

    - name: Inspect local command directory boundaries
      ansible.builtin.include_tasks: tasks/inspect_apt_shadow_dirs.yml

    - name: Inspect local commands that would shadow APT
      ansible.builtin.stat:
        path: "{{ item.1.path }}/{{ item.0.command }}"
        follow: false
      loop: "{{ apt_tool_commands | product(existing_apt_tool_shadow_dirs) | list }}"
      register: verified_apt_tool_shadows
      loop_control:
        label: "{{ item.1.path }}/{{ item.0.command }}"

    - name: Resolve selected commands to their canonical executables
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - 'resolved=$(command -v "$1") && /usr/bin/realpath --canonicalize-existing -- "$resolved"'
          - sh
          - "{{ item.command }}"
      environment:
        PATH: >-
          {{ workstation_home }}/.local/bin:{{ workstation_home }}/bin:/usr/local/bin:{{ ansible_facts.env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', true) }}
      loop: "{{ apt_tool_commands }}"
      register: verified_apt_tool_commands
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.command }}"

    - name: Record selected commands that do not use Ubuntu APT
      ansible.builtin.set_fact:
        selected_tool_resolution_errors: >-
          {{ (selected_tool_resolution_errors | default([])) +
             ([item.item.command] if
              (item.rc != 0 or item.stdout != item.item.apt_path) else []) }}
      loop: "{{ verified_apt_tool_commands.results }}"
      loop_control:
        label: "{{ item.item.command }}"

    - name: Read the APT owner of every selected command path
      ansible.builtin.command:
        argv:
          - /usr/bin/dpkg-query
          - --search
          - "{{ item.apt_path }}"
      loop: "{{ apt_tool_commands }}"
      register: verified_apt_tool_owners
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.apt_path }}"

    - name: Record selected command paths not owned by APT
      ansible.builtin.set_fact:
        selected_tool_ownership_errors: >-
          {{ (selected_tool_ownership_errors | default([])) +
             ([item.item.command] if
              (item.rc != 0 or
               (item.stdout_lines |
                select('match', '^' ~ item.item.package ~ '(:[^: ]+)?[:] ' ~ item.item.apt_path ~ '$') |
                list | length == 0)) else []) }}
      loop: "{{ verified_apt_tool_owners.results }}"
      loop_control:
        label: "{{ item.item.command }}"

    - name: Inspect managed workstation files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ oh_my_posh_path }}"
        - "{{ font_marker }}"
        - "{{ font_dir }}/CaskaydiaCoveNerdFontMono-Regular.ttf"
        - "{{ font_dir }}/CaskaydiaCoveNerdFontMono-Bold.ttf"
        - "{{ font_dir }}/CaskaydiaCoveNerdFontMono-Italic.ttf"
        - "{{ font_dir }}/CaskaydiaCoveNerdFontMono-BoldItalic.ttf"
        - "{{ workstation_home }}/.config/ubuntu-xdg-terminals.list"
        - "{{ dotfiles_dir }}/.git"
        - "{{ dotfiles_dir }}/linux-desktop.sh"
        - /usr/bin/zsh
        - "{{ librepods.install_path }}"
        - "{{ librepods.launcher_path }}"
      register: workstation_files

    - name: Read the installed Nerd Font release marker
      ansible.builtin.slurp:
        src: "{{ font_marker }}"
      register: verified_font_marker
      failed_when: false
      changed_when: false
      when: workstation_files.results[1].stat.isreg | default(false)

    - name: Read the Oh My Posh version
      ansible.builtin.command:
        argv: ["{{ oh_my_posh_path }}", version]
      register: verified_oh_my_posh_version
      changed_when: false
      failed_when: false
      when: workstation_files.results[0].stat.isreg | default(false)

    - name: Resolve the configured Nerd Font family
      ansible.builtin.command:
        argv: [fc-match, --format, "%{family}\n", "CaskaydiaCove Nerd Font Mono"]
      register: verified_font_family
      changed_when: false
      failed_when: false

    - name: Read the first default-terminal entry
      ansible.builtin.command:
        argv: [head, -n, "1", "{{ workstation_home }}/.config/ubuntu-xdg-terminals.list"]
      register: verified_terminal
      changed_when: false
      failed_when: false
      when: workstation_files.results[6].stat.isreg | default(false)

    - name: Read the account login shell
      ansible.builtin.getent:
        database: passwd
        key: "{{ workstation_user }}"

    - name: Read the dotfiles origin
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", remote, get-url, origin]
      register: verified_dotfiles_origin
      changed_when: false
      failed_when: false
      when: workstation_files.results[7].stat.isdir | default(false)

    - name: Read the dotfiles branch
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", symbolic-ref, --quiet, --short, HEAD]
      register: verified_dotfiles_branch
      changed_when: false
      failed_when: false
      when: workstation_files.results[7].stat.isdir | default(false)

    - name: Read dotfiles worktree changes
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", status, --porcelain]
      register: verified_dotfiles_status
      changed_when: false
      failed_when: false
      when: workstation_files.results[7].stat.isdir | default(false)

    - name: Read dotfiles HEAD and origin main
      ansible.builtin.command:
        argv: [git, -C, "{{ dotfiles_dir }}", rev-parse, HEAD, origin/main]
      register: verified_dotfiles_revisions
      changed_when: false
      failed_when: false
      when: workstation_files.results[7].stat.isdir | default(false)

    - name: Preview the dedicated desktop dotfiles profile
      ansible.builtin.command:
        argv: [bash, "{{ dotfiles_dir }}/linux-desktop.sh", --dry-run]
      register: verified_dotfiles_preview
      changed_when: false
      failed_when: false
      when:
        - workstation_files.results[8].stat.isreg | default(false)
        - not (workstation_files.results[8].stat.islnk | default(false))

    - name: Inspect verified core repository keys
      ansible.builtin.stat:
        path: "{{ item.key_path }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ core_vendor_repositories }}"
      loop_control:
        label: "{{ item.name }}"
      register: verified_core_keys

    - name: Inspect verified core repository sources
      ansible.builtin.stat:
        path: "{{ item.source_path }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ core_vendor_repositories }}"
      loop_control:
        label: "{{ item.name }}"
      register: verified_core_sources

    - name: Inspect Anthropic's duplicate Claude source
      ansible.builtin.stat:
        path: "{{ claude_official_source_path }}"
        follow: false
      register: verified_claude_official_source

    - name: Inspect the official ChatGPT package repository
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ chatgpt.key_path }}"
        - "{{ chatgpt.source_path }}"
        - "{{ chatgpt.defaults_path }}"
      register: verified_chatgpt_repository_paths

    - name: Inspect Claude's package repository opt-out
      ansible.builtin.stat:
        path: "{{ claude_repository_opt_out_path }}"
        follow: false
        checksum_algorithm: sha256
      register: verified_claude_repository_opt_out

    - name: Detect Claude entries outside the managed APT source
      ansible.builtin.shell: |
        set -Eeuo pipefail
        shopt -s nullglob
        list_pattern='^[[:space:]]*deb(-src)?[[:space:]].*https://downloads\.claude\.ai/claude-desktop/apt/stable'
        for path in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [[ "$path" != "{{ claude_managed_source_path }}" ]] || continue
          [[ -e "$path" || -L "$path" ]] || continue
          [[ -f "$path" ]] || continue
          if [[ "$path" == *.sources ]]; then
            pattern='{{ claude_repository_uri }}'
            grep_args=(-Fq)
          else
            pattern="$list_pattern"
            grep_args=(-Eq)
          fi
          if grep "${grep_args[@]}" "$pattern" "$path"; then
            printf '%s\n' "$path"
          else
            result=$?
            [[ "$result" -eq 1 ]] || exit "$result"
          fi
        done
      args:
        executable: /bin/bash
      register: verified_claude_unmanaged_sources
      changed_when: false

    - name: Initialize core repository readiness
      ansible.builtin.set_fact:
        claude_source_state_ready: >-
          {{ not (verified_claude_official_source.stat.exists | default(false)) and
             verified_claude_repository_opt_out.stat.isreg | default(false) and
             not (verified_claude_repository_opt_out.stat.islnk | default(false)) and
             verified_claude_repository_opt_out.stat.uid | default(-1) == 0 and
             verified_claude_repository_opt_out.stat.mode | default('') == '0644' and
             verified_claude_repository_opt_out.stat.checksum | default('') ==
               ((claude_repository_opt_out_line ~ '\n') | hash('sha256')) and
             verified_claude_unmanaged_sources.stdout_lines | length == 0 }}
        core_repository_files_ready: true
        chatgpt_repository_ready: >-
          {{ verified_chatgpt_repository_paths.results[0].stat.isreg | default(false) and
             not (verified_chatgpt_repository_paths.results[0].stat.islnk | default(false)) and
             verified_chatgpt_repository_paths.results[0].stat.checksum | default('') == chatgpt.key_sha256 and
             verified_chatgpt_repository_paths.results[1].stat.isreg | default(false) and
             not (verified_chatgpt_repository_paths.results[1].stat.islnk | default(false)) and
             verified_chatgpt_repository_paths.results[1].stat.checksum | default('') == chatgpt.source_sha256 and
             verified_chatgpt_repository_paths.results[2].stat.isreg | default(false) and
             not (verified_chatgpt_repository_paths.results[2].stat.islnk | default(false)) and
             verified_chatgpt_repository_paths.results[2].stat.checksum | default('') == chatgpt.defaults_sha256 }}

    - name: Record any failed core repository file check
      ansible.builtin.set_fact:
        core_repository_files_ready: false
      loop: "{{ core_vendor_repositories }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: core_repo_index
      when: >-
        not (
          verified_core_keys.results[core_repo_index].stat.isreg | default(false) and
          not (verified_core_keys.results[core_repo_index].stat.islnk | default(false)) and
          verified_core_keys.results[core_repo_index].stat.checksum | default('') == item.key_sha256 and
          verified_core_sources.results[core_repo_index].stat.isreg | default(false) and
          not (verified_core_sources.results[core_repo_index].stat.islnk | default(false)) and
          verified_core_sources.results[core_repo_index].stat.checksum | default('') ==
            (item.source_content | hash('sha256'))
        )

    - name: Finalize core repository readiness
      ansible.builtin.set_fact:
        core_sources_ready: "{{ claude_source_state_ready and core_repository_files_ready }}"

    - name: Detect Codex CLI without changing shell state
      ansible.builtin.shell: command -v codex
      register: verified_codex
      changed_when: false
      failed_when: false

    - name: Inspect the installed Toshy configuration
      ansible.builtin.stat:
        path: "{{ workstation_home }}/.config/toshy/toshy_config.py"
        follow: false
      register: verified_toshy_config

    - name: Inspect the Toshy status command target
      ansible.builtin.stat:
        path: "{{ workstation_home }}/.local/bin/toshy-services-status"
        follow: true
      register: verified_toshy_status_command

    - name: Read enabled GNOME extensions
      ansible.builtin.command: gnome-extensions list --enabled
      register: verified_gnome_extensions
      changed_when: false
      failed_when: false

    - name: Check whether Toshy user services are active
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-active
          - "{{ item }}"
      loop:
        - toshy-config.service
        - toshy-session-monitor.service
      register: verified_toshy_active
      changed_when: false
      failed_when: false

    - name: Check whether Toshy user services start at login
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-enabled
          - "{{ item }}"
      loop:
        - toshy-config.service
        - toshy-session-monitor.service
      register: verified_toshy_enabled
      changed_when: false
      failed_when: false

    - name: Calculate workstation readiness
      ansible.builtin.set_fact:
        prompt_ready: >-
          {{ workstation_files.results[0].stat.isreg | default(false) and
             workstation_files.results[0].stat.checksum | default('') == oh_my_posh.sha256 and
             verified_oh_my_posh_version.stdout | default('') == oh_my_posh.version }}
        font_ready: >-
          {{ workstation_files.results[1].stat.isreg | default(false) and
             not (workstation_files.results[1].stat.islnk | default(false)) and
             workstation_files.results[2].stat.isreg | default(false) and
             not (workstation_files.results[2].stat.islnk | default(false)) and
             workstation_files.results[3].stat.isreg | default(false) and
             not (workstation_files.results[3].stat.islnk | default(false)) and
             workstation_files.results[4].stat.isreg | default(false) and
             not (workstation_files.results[4].stat.islnk | default(false)) and
             workstation_files.results[5].stat.isreg | default(false) and
             not (workstation_files.results[5].stat.islnk | default(false)) and
             verified_font_marker.content | default('') | b64decode | trim == nerd_font.version and
             'CaskaydiaCove Nerd Font Mono' in (verified_font_family.stdout | default('')) }}
        terminal_ready: >-
          {{ verified_terminal.stdout | default('') == 'com.mitchellh.ghostty.desktop' }}
        shell_ready: >-
          {{ workstation_files.results[9].stat.isreg | default(false) and
             not (workstation_files.results[9].stat.islnk | default(false)) and
             workstation_files.results[9].stat.executable | default(false) and
             ansible_facts.getent_passwd[workstation_user][-1] in ['/bin/zsh', '/usr/bin/zsh'] }}
        dotfiles_ready: >-
          {{ workstation_files.results[8].stat.isreg | default(false) and
             not (workstation_files.results[8].stat.islnk | default(false)) and
             verified_dotfiles_origin.stdout | default('') in dotfiles_allowed_origins and
             verified_dotfiles_branch.stdout | default('') == 'main' and
             verified_dotfiles_status.stdout | default('DIRTY') == '' and
             verified_dotfiles_revisions.rc | default(1) == 0 and
             verified_dotfiles_revisions.stdout_lines | default([]) | length == 2 and
             verified_dotfiles_revisions.stdout_lines[0] == verified_dotfiles_revisions.stdout_lines[1] and
             verified_dotfiles_preview.rc | default(1) == 0 and
             'would apply ' not in (verified_dotfiles_preview.stdout | default('')) }}
        selected_tools_ready: >-
          {{ missing_selected_tool_packages | length == 0 and
             (verified_apt_tool_shadows.results |
              selectattr('stat.exists') | list | length) == 0 and
             selected_tool_resolution_errors | length == 0 and
              selected_tool_ownership_errors | length == 0 }}
        postman_ready: "{{ verified_postman_snap.rc | default(1) == 0 }}"
        upscayl_ready: >-
          {{ verified_upscayl_flatpak.rc | default(1) == 0 and
             verified_upscayl_flatpak.stdout | default('') | trim == core_flatpak_remote.name }}
        upscayl_legacy_routes_ready: >-
          {{ 'upscayl' not in ansible_facts.packages and
             verified_legacy_upscayl_snaps.rc | default(1) == 0 and
             (verified_legacy_upscayl_snaps.stdout_lines | default([]) |
              select('match', '^upscayl[ ]') | list | length) == 0 and
             verified_legacy_upscayl_user_flatpaks.rc | default(1) == 0 and
             'org.upscayl.Upscayl' not in
             (verified_legacy_upscayl_user_flatpaks.stdout_lines | default([])) }}
        librepods_ready: >-
          {{ workstation_files.results[10].stat.isreg | default(false) and
             not (workstation_files.results[10].stat.islnk | default(false)) and
             workstation_files.results[10].stat.executable | default(false) and
             workstation_files.results[10].stat.checksum | default('') == librepods.sha256 and
             workstation_files.results[11].stat.isreg | default(false) and
             not (workstation_files.results[11].stat.islnk | default(false)) and
             workstation_files.results[11].stat.checksum | default('') == (librepods.desktop_entry | hash('sha256')) }}
        chatgpt_ready: >-
          {{ 'chatgpt' in ansible_facts.packages and chatgpt_repository_ready }}
        macos_keys_ready: >-
          {{ verified_toshy_config.stat.isreg | default(false) and
             not (verified_toshy_config.stat.islnk | default(false)) and
             verified_toshy_status_command.stat.isreg | default(false) and
             verified_toshy_status_command.stat.executable | default(false) and
             (not ((ansible_facts.env.XDG_SESSION_TYPE | default('', true)) == 'wayland' or
                   (ansible_facts.env.WAYLAND_DISPLAY | default('', true) | length > 0)) or
              'focused-window-dbus@flexagoon.com' in (verified_gnome_extensions.stdout_lines | default([]))) and
             (verified_toshy_active.results | default([]) |
              selectattr('rc', 'equalto', 0) | list | length) == 2 and
             (verified_toshy_enabled.results | default([]) |
              selectattr('rc', 'equalto', 0) | list | length) == 2 }}

    - name: Show the ADHD-friendly workstation status board
      ansible.builtin.debug:
        msg:
          - "BASE PACKAGES      {{ 'ready' if missing_base_packages | length == 0 else 'missing: ' ~ (missing_base_packages | join(', ')) }}"
          - "APT APP PACKAGES   {{ 'ready' if missing_core_app_packages | length == 0 else 'missing: ' ~ (missing_core_app_packages | join(', ')) }}"
          - "POSTMAN            {{ 'installed' if postman_ready else 'needs apps action' }}"
          - "UPSCAYL            {{ 'installed; Vulkan launch test manual' if upscayl_ready else 'needs apps action' }}"
          - "UPSCAYL OLD ROUTES {{ 'removed' if upscayl_legacy_routes_ready else 'needs apps migration' }}"
          - "LIBREPODS          {{ 'installed; pair and launch manually' if librepods_ready else 'needs apps action' }}"
          - "PERSONAL PROMPT    {{ 'ready' if prompt_ready else 'needs base action' }}"
          - "NERD FONT          {{ 'ready' if font_ready else 'needs base action' }}"
          - >-
            CORE APT SOURCES   {{
              'ready' if core_sources_ready else
              ('needs apps action: Claude state' if not claude_source_state_ready else
               'needs apps action: managed file mismatch') }}
          - "SELECTED CLI TOOLS {{ 'ready' if selected_tools_ready else 'needs tools action' }}"
          - "MACOS KEY SERVICES {{ 'ready; run manual checklist' if macos_keys_ready else 'needs Focused Window D-Bus + keybinds action' }}"
          - "DEFAULT TERMINAL   {{ 'Ghostty' if terminal_ready else 'Ubuntu default' }}"
          - "LOGIN SHELL        {{ ansible_facts.getent_passwd[workstation_user][-1] }}"
          - "DESKTOP DOTFILES   {{ 'ready' if dotfiles_ready else 'needs dotfiles action or review' }}"
          - "1PASSWORD          {{ 'installed' if '1password' in ansible_facts.packages else 'not installed' }}"
          - "CHROME             {{ 'installed' if 'google-chrome-stable' in ansible_facts.packages else 'not installed' }}"
          - "CODEX CLI          {{ 'installed' if verified_codex.rc == 0 else 'not installed' }}"
          - "EXTENSION MANAGER  {{ 'installed' if 'gnome-shell-extension-manager' in ansible_facts.packages else 'needs apps action' }}"
          - "OBS STUDIO         {{ 'installed' if 'obs-studio' in ansible_facts.packages else 'needs apps action' }}"
          - "CLAUDE DESKTOP     {{ 'installed' if 'claude-desktop' in ansible_facts.packages else 'needs apps action' }}"
          - >-
            CHATGPT DESKTOP    {{
              'installed; launch and sign in manually' if chatgpt_ready else
              ('needs apps action: repository mismatch' if 'chatgpt' in ansible_facts.packages else
               'needs apps action') }}
          - "CLOUDFLARE WARP    {{ 'installed; enrollment manual' if 'cloudflare-warp' in ansible_facts.packages else 'needs apps action' }}"
          - "DISCORD            {{ 'installed' if 'discord' in ansible_facts.packages else 'manual official .deb' }}"
          - "PLEX WEB APP       manual Chrome step"

    - name: Require the completed core workstation state
      ansible.builtin.assert:
        that:
          - missing_required_packages | length == 0
          - postman_ready
          - librepods_ready
          - prompt_ready
          - font_ready
          - terminal_ready
          - shell_ready
          - dotfiles_ready
          - core_sources_ready
          - macos_keys_ready
          - upscayl_ready
          - upscayl_legacy_routes_ready
          - chatgpt_ready
        fail_msg: "Core setup is incomplete. Run the action named by the status board, then verify again."
        success_msg: "Core Ubuntu workstation setup is verified."
      when: strict_verify | bool
