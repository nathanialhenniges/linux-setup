---
- name: Inspect the local MacBook Air GNOME workstation
  hosts: workstation
  connection: local
  gather_facts: true
  become: false
  vars_files:
    - vars.yml
  vars:
    verification_mode: status
  pre_tasks:
    - name: Read the hardware model and operating system identity
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /sys/class/dmi/id/product_name
        - /etc/os-release
      register: platform_identity
      ignore_errors: "{{ target_warning_accepted | default(false) | bool }}"

    - name: Require the supported local workstation
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id != 'root'
          - ansible_facts.pkg_mgr == 'pacman'
          - ansible_facts.architecture == 'x86_64'
          - (target_warning_accepted | default(false) | bool) or (platform_identity.results[0].content | b64decode | trim == expected_product_name)
          - >-
            (target_warning_accepted | default(false) | bool) or
            ((platform_identity.results[1].content | b64decode) is search('(?m)^ID="?(arch|endeavouros)"?$'))
        fail_msg: "Status and verification require EndeavourOS or Arch Linux on MacBookAir7,2 unless you explicitly accept the setup.sh target warning."
        quiet: true

    - name: Read installed pacman package state
      ansible.builtin.package_facts:
        manager: pacman

    - name: Read branded boot files without following links
      ansible.builtin.stat:
        path: "{{ item.path }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - { path: /usr/share/plymouth/themes/mrdemonwolf/mrdemonwolf.plymouth }
        - { path: /usr/share/plymouth/themes/mrdemonwolf/watermark.png }
        - { path: /etc/dracut.conf.d/99-mrdemonwolf-plymouth.conf }
      register: plymouth_branding_files

    - name: Read Plymouth and systemd-boot branding settings
      ansible.builtin.command:
        argv: [cat, "{{ item }}"]
      loop:
        - /etc/plymouth/plymouthd.conf
        - /etc/kernel/cmdline
      register: plymouth_branding_settings
      changed_when: false
      failed_when: false

    - name: Read installed system Flatpak IDs
      ansible.builtin.command:
        argv: [flatpak, list, --system, --columns=application]
      register: installed_flatpaks
      changed_when: false
      failed_when: false

    - name: Read each reviewed system Flatpak origin
      ansible.builtin.command:
        argv: [flatpak, info, --system, --show-origin, "{{ item }}"]
      loop: "{{ core_flatpak_packages }}"
      loop_control:
        label: "{{ item }}"
      register: flatpak_origins
      changed_when: false
      failed_when: false

    - name: Read laptop service state
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - power-profiles-daemon.service
        - bluetooth.service
        - NetworkManager.service
      loop_control:
        label: "{{ item }}"
      register: workstation_services
      changed_when: false
      failed_when: false

    - name: Read GDM enablement without starting the login screen
      ansible.builtin.command:
        argv: [systemctl, is-enabled, gdm.service]
      register: gdm_state
      changed_when: false
      failed_when: false

    - name: Read SDDM enablement without starting the login screen
      ansible.builtin.command:
        argv: [systemctl, is-enabled, sddm.service]
      register: sddm_state
      changed_when: false
      failed_when: false

    - name: Read the selected Plymouth theme
      ansible.builtin.command:
        argv: [plymouth-set-default-theme]
      register: selected_plymouth_theme
      changed_when: false
      failed_when: false

    - name: Read extensions configured for this GNOME user
      ansible.builtin.command:
        argv: [gsettings, get, org.gnome.shell, enabled-extensions]
      register: configured_gnome_extensions
      changed_when: false
      failed_when: false

    - name: Read extensions active in the current GNOME session
      ansible.builtin.command:
        argv: [gnome-extensions, list, --enabled]
      register: active_gnome_extensions
      changed_when: false
      failed_when: false

    - name: Inspect the LibrePods login entry
      ansible.builtin.stat:
        path: "{{ librepods.autostart_path }}"
        follow: false
        checksum_algorithm: sha256
      register: librepods_autostart_file

    - name: Read GNOME favorite applications
      ansible.builtin.command:
        argv: [gsettings, get, org.gnome.shell, favorite-apps]
      register: gnome_favorite_apps
      changed_when: false
      failed_when: false

    - name: Read sshd service state without changing it
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", sshd.service]
      loop: [is-active, is-enabled]
      register: sshd_state
      changed_when: false
      failed_when: false

    - name: Read the system Flathub URL
      ansible.builtin.command:
        argv: [flatpak, remotes, --system, "--columns=name,url"]
      register: flatpak_remotes
      changed_when: false
      failed_when: false

  tasks:
    - name: Report missing pacman packages
      ansible.builtin.set_fact:
        missing_pacman_packages: >-
          {{ (core_base_packages + core_pacman_app_packages + core_tool_packages + core_external_packages + (aur_package_names | default([])))
             | unique | reject('in', ansible_facts.packages.keys() | list) | list }}

    - name: Report missing system Flatpaks
      ansible.builtin.set_fact:
        missing_flatpak_packages: "{{ core_flatpak_packages | difference(installed_flatpaks.stdout_lines | default([])) }}"

    - name: Report whether the branded Plymouth splash is fully configured
      ansible.builtin.set_fact:
        plymouth_branding_ready: >-
          {{ plymouth_branding_files.results[0].stat.checksum | default('') == plymouth_theme_sha256 and
             plymouth_branding_files.results[1].stat.checksum | default('') == plymouth_logo_sha256 and
             plymouth_branding_files.results[2].stat.checksum | default('') == dracut_plymouth_config_sha256 and
             'Theme=mrdemonwolf' in plymouth_branding_settings.results[0].stdout and
             selected_plymouth_theme.stdout | default('') | trim == 'mrdemonwolf' and
             'quiet' in plymouth_branding_settings.results[1].stdout.split() and
             'splash' in plymouth_branding_settings.results[1].stdout.split() }}

    - name: Report whether LibrePods will start minimized at login
      ansible.builtin.set_fact:
        librepods_autostart_ready: >-
          {{ librepods_autostart_file.stat.isreg | default(false) and
             not (librepods_autostart_file.stat.islnk | default(false)) and
             librepods_autostart_file.stat.checksum | default('') ==
             (lookup('ansible.builtin.template', 'librepods-autostart.desktop.j2') | hash('sha256')) }}

    - name: Report whether the GNOME tray and dock extensions are configured
      ansible.builtin.set_fact:
        configured_gnome_extension_ids: >-
          {{ configured_gnome_extensions.stdout | default('[]', true) | replace('@as ', '') | from_yaml }}
        gnome_extensions_configured: >-
          {{ gnome_required_extensions | difference(configured_gnome_extensions.stdout | default('[]', true) | replace('@as ', '') | from_yaml) | length == 0 }}
        gnome_extensions_active: >-
          {{ gnome_required_extensions | difference(active_gnome_extensions.stdout_lines | default([])) | length == 0 }}

    - name: Select the configured Flathub system remote
      ansible.builtin.set_fact:
        flathub_system_lines: "{{ flatpak_remotes.stdout_lines | default([]) | select('match', '^flathub\\s') | list }}"

    - name: Enforce the requested workstation state
      ansible.builtin.assert:
        that:
          - missing_pacman_packages | length == 0
          - missing_flatpak_packages | length == 0
          - flatpak_origins.results | length == core_flatpak_packages | length
          - flatpak_origins.results | selectattr('rc', 'equalto', 0) | selectattr('stdout', 'equalto', core_flatpak_remote.name) | list | length == core_flatpak_packages | length
          - flathub_system_lines | length == 1
          - flathub_system_lines[0].split()[-1] == core_flatpak_remote.url
          - workstation_services.results | selectattr('rc', 'equalto', 0) | selectattr('stdout', 'equalto', 'active') | list | length == 3
          - gdm_state.stdout == 'enabled'
          - sddm_state.stdout not in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime']
          - gnome_extensions_configured
          - librepods_autostart_ready
          - "gnome_favorite_apps.stdout is search('org.gnome.Nautilus.desktop')"
          - "gnome_favorite_apps.stdout is search('google-chrome.desktop')"
          - "gnome_favorite_apps.stdout is search('com.onepassword.OnePassword.desktop')"
          - "gnome_favorite_apps.stdout is search('discord.desktop')"
          - "gnome_favorite_apps.stdout is search('chatgpt.desktop')"
          - plymouth_branding_ready
          - sshd_state.results[0].stdout != 'active'
          - sshd_state.results[1].stdout not in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime']
        fail_msg: "Workstation verification found missing packages, untrusted Flatpaks, missing GNOME dock/tray/autostart or boot branding, or inactive laptop services. See the state report."
        quiet: true
      when: verification_mode == 'verify'

    - name: Show workstation package state
      ansible.builtin.debug:
        msg:
          - "Missing pacman packages: {{ missing_pacman_packages }}"
          - "Missing system Flatpaks: {{ missing_flatpak_packages }}"
          - "Flatpak origins: {{ flatpak_origins.results | map(attribute='stdout') | list }}"
          - "Power, Bluetooth, and NetworkManager services: {{ workstation_services.results | map(attribute='stdout') | list }}"
          - "GDM enablement: {{ gdm_state.stdout }}"
          - "SDDM enablement: {{ sddm_state.stdout }}"
          - "GNOME extensions configured to load: {{ configured_gnome_extension_ids }}"
          - "GNOME extensions active in this session: {{ active_gnome_extensions.stdout_lines | default([]) }}"
          - "GNOME extensions will load: {{ 'already active' if gnome_extensions_active else 'at the next GNOME login' }}"
          - "LibrePods minimized login start: {{ 'ready' if librepods_autostart_ready else 'missing' }}"
          - "GNOME favorites: {{ gnome_favorite_apps.stdout }}"
          - "MrDemonWolf Plymouth branding ready: {{ plymouth_branding_ready }}"
          - "sshd service state: {{ sshd_state.results | map(attribute='stdout') | list }}"
          - "AUR apps: {{ aur_package_names | default([]) }}"
          - "OpenAI packages: {{ core_external_packages }}"
      when: verification_mode in ['state', 'verify']

    - name: Show concise workstation status
      ansible.builtin.debug:
        msg: >-
          {{ 'Ready' if (missing_pacman_packages | length == 0 and missing_flatpak_packages | length == 0 and gnome_extensions_configured and librepods_autostart_ready and gnome_favorite_apps.stdout is search('google-chrome.desktop') and gnome_favorite_apps.stdout is search('com.onepassword.OnePassword.desktop') and plymouth_branding_ready and gdm_state.stdout == 'enabled' and sddm_state.stdout not in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime'])
             else 'Needs setup' }} — {{ missing_pacman_packages | length }} pacman packages and
          {{ missing_flatpak_packages | length }} system Flatpaks, GNOME dock {{ 'active' if gnome_extensions_active else ('configured for next login' if gnome_extensions_configured else 'missing') }}, Plymouth branding {{ 'ready' if plymouth_branding_ready else 'missing' }}.
      when: verification_mode == 'status'
