name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref. Superseded pull request runs are cancelled; main runs
# queue instead, so a Pages deployment is never cut off part way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch-container:
    name: Arch container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run isolated Arch Linux checks
        run: |
          bash tests/test_container_cleanup.sh
          bash tests/run_container.sh

  guide-browser:
    name: Guide and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run guide checks in the official Playwright container
        run: bash tests/run_browser_container.sh

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [arch-container, guide-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the static guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy the guide
        id: deployment
        uses: actions/deploy-pages@v5
