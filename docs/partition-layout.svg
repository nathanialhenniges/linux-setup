<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title desc">
  <title id="title">Simple encrypted EndeavourOS installation</title>
  <desc id="desc">Select the 465.92 GiB internal Apple SSD, choose Erase disk, enable Encrypt System, save the passphrase, keep systemd-boot, and install. Add encrypted swap and set up hibernation later.</desc>
  <rect width="440" height="440" rx="22" fill="#091533"/>
  <text x="22" y="36" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="17" font-weight="800">AUTOMATIC INSTALL · ENCRYPTED</text>
  <text x="22" y="62" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Apple SSD · 465.92 GiB · /dev/sda</text>
  <g font-family="system-ui,sans-serif">
    <rect x="18" y="82" width="404" height="54" rx="12" fill="#123b69" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="46" cy="109" r="15" fill="#0369a1"/><text x="46" y="114" fill="#fff" text-anchor="middle" font-size="13" font-weight="800">1</text>
    <text x="72" y="105" fill="#e0f2fe" font-size="13" font-weight="800">Select the internal Apple SSD</text>
    <text x="72" y="123" fill="#cbd5e1" font-size="11">Check the model and size before continuing</text>

    <rect x="18" y="148" width="404" height="54" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="46" cy="175" r="15" fill="#0369a1"/><text x="46" y="180" fill="#fff" text-anchor="middle" font-size="13" font-weight="800">2</text>
    <text x="72" y="171" fill="#e0f2fe" font-size="13" font-weight="800">Choose Erase disk</text>
    <text x="72" y="189" fill="#cbd5e1" font-size="11">The installer creates the partitions</text>

    <rect x="18" y="214" width="404" height="54" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="46" cy="241" r="15" fill="#0369a1"/><text x="46" y="246" fill="#fff" text-anchor="middle" font-size="13" font-weight="800">3</text>
    <text x="72" y="237" fill="#e0f2fe" font-size="13" font-weight="800">Turn on Encrypt System</text>
    <text x="72" y="255" fill="#cbd5e1" font-size="11">Set and safely keep the passphrase</text>

    <rect x="18" y="280" width="404" height="54" rx="12" fill="#123b69" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="46" cy="307" r="15" fill="#0369a1"/><text x="46" y="312" fill="#fff" text-anchor="middle" font-size="13" font-weight="800">4</text>
    <text x="72" y="303" fill="#e0f2fe" font-size="13" font-weight="800">Keep systemd-boot and install</text>
    <text x="72" y="321" fill="#cbd5e1" font-size="11">Review the summary before clicking Install</text>

    <rect x="18" y="350" width="404" height="54" rx="12" fill="#3f2c13" stroke="#fbbf24" stroke-width="2"/>
    <text x="34" y="373" fill="#fde68a" font-size="12" font-weight="800">AFTER INSTALL</text>
    <text x="34" y="392" fill="#f8fafc" font-size="11">Add encrypted swapfile and configure hibernation</text>
  </g>
  <text x="22" y="426" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">The firmware boot partition stays unencrypted so the Mac can start Linux.</text>
</svg>
